# Self-hosted Spoonjoy's image, ghcr.io/spoonjoy/spoonjoy (self-host/Dockerfile, docs/self-hosting.md).
# Each arch builds natively, boots the image on a clean runner, seeds the QA kitchen through the
# image's own `sql` command, runs the Journeys sign-in and round-trip smoke set against it with a
# screenshot of every test, checks the kitchen survives a restart, and restores a backup of it into
# a fresh server. Only a push to main pushes, and the multi-arch `latest` and version tags are
# published only after both arches pass.
name: Self-host Image

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - self-host/**
      - .github/workflows/self-host-image.yml
      - scripts/self-host-smoke-seed.mjs
      - scripts/seed-qa-kitchen.mjs
      - playwright.self-host.config.ts
      - playwright.self-host-fresh.config.ts
      - e2e/self-host/**
      - app/routes/move-in.tsx
      - app/domains/move-in/adapters/worker/**
      - app/domains/platform/ports/jobs.ts
      - e2e/fixtures.ts
      - app/lib/session.server.ts
      - app/lib/apple-native-auth.server.ts
      - app/lib/server-access.server.ts
      - app/lib/oauth-user.server.ts
      - app/lib/oauth-route.server.ts
      - app/lib/oauth-callback-route.server.ts
      - app/lib/oidc-callback.server.ts
      - app/lib/oidc.server.ts
      - app/components/oauth.tsx
      - app/routes/signup.tsx
      - app/routes/account.server-settings.tsx
      - app/routes/account.server-backups.$name.tsx
      - app/lib/server-ai.server.ts
      - app/lib/self-host-backups.server.ts
      - app/lib/transactional-email.server.ts
      - app/lib/password-reset.server.ts
      - app/routes/forgot-password.tsx
      - app/routes/reset-password.tsx
      - playwright.journeys.config.ts
      - e2e/journeys/**
      - migrations/**
      - wrangler.json
      - package.json
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: self-host-image-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/spoonjoy/spoonjoy
  LOCAL_IMAGE: spoonjoy-self-host:smoke
  OUT: self-host-out

jobs:
  image:
    name: image ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    # Both arches name the same version (the commit's), so either one's output is the version.
    outputs:
      version: ${{ steps.version.outputs.version }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      # The version is the commit's UTC date and short hash, so every image on main has its own tag.
      - name: Name the version
        id: version
        run: |
          version="$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y.%m.%d)-${GITHUB_SHA::7}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          mkdir -p "$OUT"
          echo "Version $version"

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The same production build spoonjoy.app deploys. No PostHog key is given, and the client
      # build is told analytics are off, so the image sends nothing anywhere unless its owner sets
      # their own POSTHOG_KEY.
      - name: Build the app
        env:
          VITE_POSTHOG_DISABLED: '1'
        run: pnpm run build

      - name: Build the image
        run: |
          start=$(date +%s%3N)
          docker build -f self-host/Dockerfile --build-arg SPOONJOY_VERSION="$VERSION" -t "$LOCAL_IMAGE" .
          end=$(date +%s%3N)
          size=$(docker image inspect "$LOCAL_IMAGE" --format '{{.Size}}')
          gz=$(docker save "$LOCAL_IMAGE" | gzip -1 | wc -c)
          echo "{\"imageBuildMs\": $(( end - start )), \"imageBytes\": $size, \"imageGzipBytes\": $gz}" > "$OUT/image.json"
          cat "$OUT/image.json"

      # From `docker run` on an empty volume (the first start migrates the whole database) to the
      # first page.
      - name: Cold boot to the first page
        run: |
          docker volume create sj-data
          start=$(date +%s%3N)
          docker run -d --name sj -p 8080:8080 -v sj-data:/data --health-start-interval 1s "$LOCAL_IMAGE"
          code=000
          for _ in $(seq 1 600); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/ || true)
            [ "$code" = "200" ] && break
            sleep 0.1
          done
          end=$(date +%s%3N)
          echo "{\"coldBootToFirstPageMs\": $(( end - start )), \"firstPageStatus\": \"$code\"}" > "$OUT/boot.json"
          cat "$OUT/boot.json"
          docker logs sj
          [ "$code" = "200" ]

      - name: Wait for the image's health check
        run: |
          status=starting
          for _ in $(seq 1 60); do
            status=$(docker inspect sj --format '{{.State.Health.Status}}')
            [ "$status" = "healthy" ] && break
            sleep 1
          done
          echo "Health: $status"
          curl -sf http://localhost:8080/health/ready
          sleep 2
          docker stats --no-stream --format '{{json .}}' sj > "$OUT/memory-idle.json"
          cat "$OUT/memory-idle.json"
          [ "$status" = "healthy" ]

      # The empty server as its owner first meets it, before anything is seeded: sign up with a
      # password, add a passkey and sign back in with it, and the Spoonjoy apps' Sign in with Apple
      # checked against Apple's public keys (e2e/self-host, playwright.self-host-fresh.config.ts).
      # The owner's account is the server's admin: they turn sign-ups off, a stranger is refused,
      # and an invite link they make signs up one person and then stops working.
      - name: Sign in on the fresh server, with its sign-ups and invites
        run: |
          docker run --rm --network host --user "$(id -u):$(id -g)" --ipc host \
            -v "$PWD:/work" -w /work -e HOME=/tmp -e CI=true \
            -e SPOONJOY_JOURNEYS_BASE_URL=http://localhost:8080 \
            -e SPOONJOY_SELF_HOST_INVITE_OUT=.self-host/oidc-invite.txt \
            mcr.microsoft.com/playwright@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f \
            node node_modules/@playwright/test/cli.js test -c playwright.self-host-fresh.config.ts

      # Sign-in with the owner's own OpenID Connect provider (SPOONJOY_OIDC_*): Dex, pinned by digest,
      # with the one client and user in e2e/self-host/dex.yaml. The server is invite-only by now, so
      # Dex's user is refused, then signs up from the invite link the last step left. The server runs on the host network
      # here so it reaches Dex at localhost:5556, the address the browser uses and Dex's ID tokens
      # name as their issuer. The client secret and password are test values that open nothing else.
      # Playwright empties its output folder on start, so this run writes to its own and the fresh
      # server's screenshots survive.
      - name: Sign in through an OpenID Connect provider
        run: |
          docker run -d --name dex -p 5556:5556 -v "$PWD/e2e/self-host/dex.yaml:/etc/dex/config.yaml:ro" \
            ghcr.io/dexidp/dex@sha256:65b72ca0f4b0bf6d4ada84ec21da8851782563404ac7b8f926923d27ceced9ab \
            dex serve /etc/dex/config.yaml
          for _ in $(seq 1 300); do
            curl -sf -o /dev/null http://localhost:5556/dex/.well-known/openid-configuration && break
            sleep 0.1
          done
          curl -sf -o /dev/null http://localhost:5556/dex/.well-known/openid-configuration
          docker stop sj
          docker rm sj
          docker run -d --name sj --network host -v sj-data:/data \
            -e SPOONJOY_OIDC_ISSUER=http://localhost:5556/dex \
            -e SPOONJOY_OIDC_CLIENT_ID=spoonjoy-self-host \
            -e SPOONJOY_OIDC_CLIENT_SECRET=spoonjoy-self-host-test-secret \
            -e "SPOONJOY_OIDC_NAME=Sign in with Dex" \
            "$LOCAL_IMAGE"
          for _ in $(seq 1 600); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/health/ready || true)" = "200" ] && break
            sleep 0.1
          done
          curl -sf http://localhost:8080/health/ready
          docker run --rm --network host --user "$(id -u):$(id -g)" --ipc host \
            -v "$PWD:/work" -w /work -e HOME=/tmp -e CI=true \
            -e SPOONJOY_JOURNEYS_BASE_URL=http://localhost:8080 \
            -e "SPOONJOY_SELF_HOST_OIDC_LABEL=Sign in with Dex" \
            -e SPOONJOY_SELF_HOST_INVITE_FILE=.self-host/oidc-invite.txt \
            mcr.microsoft.com/playwright@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f \
            node node_modules/@playwright/test/cli.js test -c playwright.self-host-fresh.config.ts e2e/self-host/oidc.spec.ts --output test-results-self-host-oidc

      # The kitchen and this run's scratch users, with fresh passwords, through the image's own
      # `server.mjs sql -` (with the server stopped, as docs/self-hosting.md says to), and the
      # sample cover photos two of its recipes show (assets/sample-covers) through `server.mjs photos`.
      - name: Seed the QA kitchen
        run: |
          mkdir -p .self-host
          node scripts/self-host-smoke-seed.mjs --sql-out .self-host/kitchen.sql --credentials-out .self-host/credentials.json
          for p in chef friend newbie; do
            echo "::add-mask::$(jq -r ".${p}.password" .self-host/credentials.json)"
          done
          while IFS= read -r password; do
            echo "::add-mask::$password"
          done < <(jq -r '(.scratch[]?, .scratchDesktop[]?) | .password' .self-host/credentials.json)
          docker stop sj
          docker run --rm -i -v sj-data:/data "$LOCAL_IMAGE" node /app/self-host/server.mjs sql - < .self-host/kitchen.sql
          rm .self-host/kitchen.sql
          docker run --rm -v sj-data:/data -v "$PWD/assets/sample-covers:/covers:ro" "$LOCAL_IMAGE" node /app/self-host/server.mjs photos /covers samples/covers/
          docker start sj
          for _ in $(seq 1 600); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/health/ready || true)" = "200" ] && break
            sleep 0.1
          done
          curl -sf http://localhost:8080/health/ready

      # Playwright runs in its own image, pinned like the Journeys workflow's
      # (scripts/deployment-preflight.ts PLAYWRIGHT_CONTAINER), on the host network so it reaches
      # the container at localhost, with this checkout's dependencies. The server is a throwaway
      # one; it allows 120 sign-ins a minute for the personas setup's 19 up front.
      - name: Run the Journeys smoke set against the image
        run: |
          docker stop sj
          docker rm sj
          docker run -d --name sj -p 8080:8080 -v sj-data:/data -e SPOONJOY_RATE_LIMIT_AUTH_IP_RATE_LIMITER=120 "$LOCAL_IMAGE"
          for _ in $(seq 1 600); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/health/ready || true)" = "200" ] && break
            sleep 0.1
          done
          docker run --rm --network host --user "$(id -u):$(id -g)" --ipc host \
            -v "$PWD:/work" -w /work -e HOME=/tmp -e CI=true \
            -e SPOONJOY_JOURNEYS_BASE_URL=http://localhost:8080 \
            -e SPOONJOY_QA_CREDENTIALS=/work/.self-host/credentials.json \
            mcr.microsoft.com/playwright@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f \
            node node_modules/@playwright/test/cli.js test -c playwright.self-host.config.ts \
              e2e/journeys/personas.setup.ts e2e/journeys/sign-in.journey.ts e2e/journeys/round-trips.journey.ts

      # The server's own web push key (self-host/push-keys.mjs) must survive the restart too, or
      # every browser that subscribed would stop getting notifications.
      - name: Check the kitchen survives a restart
        if: success()
        run: |
          push_key=$(curl -sf http://localhost:8080/api/push/public-key | jq -r .key)
          [ "${#push_key}" = 87 ]
          start=$(date +%s%3N)
          docker restart sj
          for _ in $(seq 1 600); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/ || true)" = "200" ] && break
            sleep 0.1
          done
          end=$(date +%s%3N)
          curl -sf http://localhost:8080/recipes/qa-kitchen-recipe-risotto -o .self-host/risotto.html
          grep -q "Saffron Risotto" .self-host/risotto.html
          rm .self-host/risotto.html
          [ "$(curl -sf http://localhost:8080/api/push/public-key | jq -r .key)" = "$push_key" ]
          echo "{\"restartToFirstPageMs\": $(( end - start ))}" > "$OUT/restart.json"
          cat "$OUT/restart.json"

      # A backup of the seeded kitchen (`server.mjs backup`, the server stopped), restored into a
      # second, empty volume (`server.mjs restore`), must bring back the risotto and its photo byte
      # for byte; Playwright's screenshot shows it. The restored server backs itself up every minute
      # here, keeping one, to show the schedule runs. The container's user (node) writes the backup,
      # so the folder is open to it; the backup holds this run's scratch passwords' hashes and isn't
      # uploaded.
      # Every container here stays off Docker's bridge: the restored server shares the host's network
      # and the one-off backup, restore and stat containers have none. A container joining the bridge
      # adds a network interface, and Chrome on the host network drops the page's loads with
      # ERR_NETWORK_CHANGED when it sees one appear (main's run 45324007523, amd64).
      - name: Back up the kitchen and restore it into a fresh server
        if: success()
        run: |
          docker stop sj
          mkdir -p .self-host/backups
          chmod 777 .self-host/backups
          docker run --rm --network none -v sj-data:/data -v "$PWD/.self-host/backups:/backups" "$LOCAL_IMAGE" \
            node /app/self-host/server.mjs backup /backups/kitchen.tar.gz
          docker volume create sj-restored
          start=$(date +%s%3N)
          docker run --rm --network none -v sj-restored:/data -v "$PWD/.self-host/backups:/backups:ro" "$LOCAL_IMAGE" \
            node /app/self-host/server.mjs restore /backups/kitchen.tar.gz
          end=$(date +%s%3N)
          bytes=$(docker run --rm --network none -v "$PWD/.self-host/backups:/backups:ro" "$LOCAL_IMAGE" stat -c %s /backups/kitchen.tar.gz)
          echo "{\"restoreMs\": $(( end - start )), \"backupBytes\": $bytes}" > "$OUT/restore.json"
          cat "$OUT/restore.json"
          docker run -d --name sj-restored --network host -v sj-restored:/data \
            -e "SPOONJOY_BACKUP_SCHEDULE=* * * * *" -e SPOONJOY_BACKUPS_KEPT=1 "$LOCAL_IMAGE"
          for _ in $(seq 1 600); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/health/ready || true)" = "200" ] && break
            sleep 0.1
          done
          curl -sf http://localhost:8080/recipes/qa-kitchen-recipe-risotto -o .self-host/risotto.html
          grep -q "Saffron Risotto" .self-host/risotto.html
          grep -q "/photos/samples/covers/penne-ragu.jpg" .self-host/risotto.html
          curl -sf http://localhost:8080/photos/samples/covers/penne-ragu.jpg -o .self-host/penne-ragu.jpg
          cmp .self-host/penne-ragu.jpg assets/sample-covers/penne-ragu.jpg
          docker run --rm --network host --user "$(id -u):$(id -g)" --ipc host \
            -v "$PWD:/work" -w /work -e HOME=/tmp -e CI=true \
            -e SPOONJOY_JOURNEYS_BASE_URL=http://localhost:8080 \
            -e SPOONJOY_SELF_HOST_RESTORED=1 \
            mcr.microsoft.com/playwright@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f \
            node node_modules/@playwright/test/cli.js test -c playwright.self-host-fresh.config.ts e2e/self-host/restored.spec.ts --output test-results-self-host-restored
          for _ in $(seq 1 90); do
            docker logs sj-restored 2>/dev/null | grep -q '"event":"backup","kind":"auto"' && break
            sleep 1
          done
          docker logs sj-restored 2>/dev/null | grep '"event":"backup","kind":"auto"'
          docker exec sj-restored ls /data/backups

      # Platform jobs end to end: a fresh server with move-in on (on 8082, on the host network beside
      # the restored server) moves a small proof kitchen in, which runs as jobs on the server's
      # in-process JOBS queue. Its backup's PlatformJobKey rows then show the move-in jobs done.
      - name: Move a kitchen in through the server's jobs queue
        if: success()
        run: |
          docker volume create sj-jobs
          docker run -d --name sj-jobs --network host -v sj-jobs:/data -e PORT=8082 -e SPOONJOY_FLAGS=move_in "$LOCAL_IMAGE"
          for _ in $(seq 1 600); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8082/health/ready || true)" = "200" ] && break
            sleep 0.1
          done
          curl -sf http://localhost:8082/health/ready
          docker run --rm --network host --user "$(id -u):$(id -g)" --ipc host \
            -v "$PWD:/work" -w /work -e HOME=/tmp -e CI=true \
            -e SPOONJOY_JOURNEYS_BASE_URL=http://localhost:8082 \
            -e SPOONJOY_SELF_HOST_MOVE_IN=1 \
            mcr.microsoft.com/playwright@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f \
            node node_modules/@playwright/test/cli.js test -c playwright.self-host-fresh.config.ts e2e/self-host/move-in.spec.ts --output test-results-self-host-move-in
          docker stop sj-jobs
          mkdir -p .self-host/backups && chmod 777 .self-host/backups
          docker run --rm --network none -v sj-jobs:/data -v "$PWD/.self-host/backups:/backups" "$LOCAL_IMAGE" \
            node /app/self-host/server.mjs backup /backups/jobs.tar.gz
          # The image reads its own backup: the file belongs to the container's user, not the runner's.
          # The result is captured first, so a failed check fails the step rather than vanishing in a pipe.
          jobs=$(docker run --rm --network none -v "$PWD/.self-host/backups:/backups:ro" "$LOCAL_IMAGE" node --input-type=module -e '
            import { readTarGz } from "/app/self-host/backup.mjs";
            let keys;
            for await (const { name, data } of readTarGz("/backups/jobs.tar.gz")) {
              if (name === "database.json") keys = JSON.parse(Buffer.from(data).toString("utf8")).tables.find((table) => table.name === "PlatformJobKey");
            }
            if (!keys) throw new Error("The backup has no PlatformJobKey rows, so no job ran on the JOBS queue.");
            const [type, status] = ["type", "status"].map((column) => keys.columns.indexOf(column));
            const done = keys.rows.filter((row) => row[type] === "move-in.run" && row[status] === "done").length;
            if (!done) throw new Error("No move-in job ran to done on the JOBS queue of the server.");
            console.log(JSON.stringify({ moveInJobsDone: done, jobKeys: keys.rows.length }));
          ')
          echo "$jobs" | tee "$OUT/jobs.json"

      # A move-in the server restarts in the middle of. The first server runs with the test-only
      # SPOONJOY_JOBS_PAUSED=1 (self-host/config.mjs), so its queue takes the move-in's job but runs
      # none: a cook starts moving the large proof kitchen in and leaves, the server stops, and its
      # backup shows the move-in and its job still waiting, every time. A server on the same data
      # without the switch then has to finish the move-in with no page open to nudge it.
      # On 8084, on the host network.
      - name: Finish a move-in the server restarts in the middle of
        if: success()
        run: |
          ready() {
            for _ in $(seq 1 600); do
              [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8084/health/ready || true)" = "200" ] && break
              sleep 0.1
            done
            curl -sf http://localhost:8084/health/ready
          }
          restart_half() {
            docker run --rm --network host --user "$(id -u):$(id -g)" --ipc host \
              -v "$PWD:/work" -w /work -e HOME=/tmp -e CI=true \
              -e SPOONJOY_JOURNEYS_BASE_URL=http://localhost:8084 \
              -e SPOONJOY_SELF_HOST_MOVE_IN_RESTART="$1" \
              -e SPOONJOY_SELF_HOST_MOVE_IN_RESTART_STATE=.self-host/move-in-restart.json \
              mcr.microsoft.com/playwright@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f \
              node node_modules/@playwright/test/cli.js test -c playwright.self-host-fresh.config.ts e2e/self-host/move-in-restart.spec.ts --output "test-results-self-host-move-in-restart-$1"
          }
          docker volume create sj-restart
          docker run -d --name sj-restart --network host -v sj-restart:/data -e PORT=8084 -e SPOONJOY_FLAGS=move_in \
            -e SPOONJOY_JOBS_PAUSED=1 "$LOCAL_IMAGE"
          ready
          restart_half before
          docker stop sj-restart
          docker logs sj-restart > "$OUT/move-in-restart-paused.log" 2>&1
          docker rm sj-restart
          mkdir -p .self-host/backups && chmod 777 .self-host/backups
          docker run --rm --network none -v sj-restart:/data -v "$PWD/.self-host/backups:/backups" "$LOCAL_IMAGE" \
            node /app/self-host/server.mjs backup /backups/restart.tar.gz
          # The result is captured first, so a failed check fails the step rather than vanishing in a pipe.
          stopped=$(docker run --rm --network none -v "$PWD/.self-host/backups:/backups:ro" "$LOCAL_IMAGE" node --input-type=module -e '
            import { readTarGz } from "/app/self-host/backup.mjs";
            const tables = {};
            for await (const { name, data } of readTarGz("/backups/restart.tar.gz")) {
              if (name === "database.json") for (const table of JSON.parse(Buffer.from(data).toString("utf8")).tables) tables[table.name] = table;
            }
            const rows = (name) => (tables[name]?.rows ?? []).map((row) => Object.fromEntries(tables[name].columns.map((column, index) => [column, row[index]])));
            const moveIns = rows("ImportJob");
            if (moveIns.length !== 1 || moveIns[0].finishedAt) throw new Error("The server had no waiting move-in when it stopped.");
            const waiting = rows("PlatformJobKey").filter((key) => key.type === "move-in.run" && key.status === "pending");
            if (waiting.length !== 1) throw new Error("The move-in had no job waiting when the server stopped.");
            console.log(JSON.stringify({ moveInAtStop: { status: moveIns[0].status, phase: moveIns[0].phase, jobWaiting: waiting[0].key } }));
          ')
          echo "$stopped" | tee "$OUT/move-in-restart.json"
          docker run -d --name sj-restart --network host -v sj-restart:/data -e PORT=8084 -e SPOONJOY_FLAGS=move_in "$LOCAL_IMAGE"
          ready
          restart_half after
          docker logs sj-restart > "$OUT/move-in-restart.log" 2>&1
          docker rm -f sj-restart
      # A server on a home network: its owner reaches it at a plain http:// address that isn't
      # localhost and declares that address as SPOONJOY_BASE_URL. The server gets a fixed address on
      # its own bridge network, made before the browser starts (a new interface under a running
      # Chrome drops its loads), and the browser signs in there with a password and reloads.
      - name: Sign in at a plain http network address
        if: success()
        run: |
          docker network create --subnet 172.30.57.0/24 sj-lan
          docker run -d --name sj-lan --network sj-lan --ip 172.30.57.10 -v sj-lan:/data \
            -e SPOONJOY_BASE_URL=http://172.30.57.10:8080 "$LOCAL_IMAGE"
          for _ in $(seq 1 600); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://172.30.57.10:8080/health/ready || true)" = "200" ] && break
            sleep 0.1
          done
          curl -sf http://172.30.57.10:8080/health/ready
          docker run --rm --network host --user "$(id -u):$(id -g)" --ipc host \
            -v "$PWD:/work" -w /work -e HOME=/tmp -e CI=true \
            -e SPOONJOY_JOURNEYS_BASE_URL=http://172.30.57.10:8080 \
            -e SPOONJOY_SELF_HOST_LAN=1 \
            mcr.microsoft.com/playwright@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f \
            node node_modules/@playwright/test/cli.js test -c playwright.self-host-fresh.config.ts e2e/self-host/lan.spec.ts --output test-results-self-host-lan
          docker logs sj-lan > "$OUT/lan.log" 2>&1
          docker rm -f sj-lan
          docker network rm sj-lan

      # Account mail through the owner's SMTP server (SPOONJOY_SMTP_*): Mailpit, pinned by digest, takes it on 1025, plain
      # as from a relay on the same network, and answers its API on 8025. A cook resets a forgotten password from the link
      # in the caught mail and signs in with the new one.
      - name: Send account mail through an SMTP server
        if: success()
        run: |
          docker run -d --name mailpit --network host \
            axllent/mailpit@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
          docker run -d --name sj-mail --network host -v sj-mail:/data -e PORT=8086 \
            -e SPOONJOY_BASE_URL=http://localhost:8086 \
            -e SPOONJOY_SMTP_HOST=127.0.0.1 -e SPOONJOY_SMTP_PORT=1025 -e SPOONJOY_SMTP_SECURITY=none \
            -e "SPOONJOY_EMAIL_FROM=Spoonjoy <kitchen@example.com>" \
            "$LOCAL_IMAGE"
          for _ in $(seq 1 600); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8086/health/ready || true)" = "200" ] \
              && curl -sf -o /dev/null http://localhost:8025/api/v1/info && break
            sleep 0.1
          done
          curl -sf http://localhost:8086/health/ready
          curl -sf -o /dev/null http://localhost:8025/api/v1/info
          docker run --rm --network host --user "$(id -u):$(id -g)" --ipc host \
            -v "$PWD:/work" -w /work -e HOME=/tmp -e CI=true \
            -e SPOONJOY_JOURNEYS_BASE_URL=http://localhost:8086 \
            -e SPOONJOY_SELF_HOST_MAIL=http://localhost:8025 \
            mcr.microsoft.com/playwright@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f \
            node node_modules/@playwright/test/cli.js test -c playwright.self-host-fresh.config.ts e2e/self-host/mail.spec.ts --output test-results-self-host-mail
          docker logs sj-mail > "$OUT/mail.log" 2>&1
          grep -q '"event":"mail-sent"' "$OUT/mail.log"
          docker rm -f sj-mail mailpit

      # The Compose file in the guide (self-host/compose.yaml) starts this image and waits for its
      # health check; on 8081, beside the restored server.
      - name: Start it with Docker Compose
        if: success()
        run: |
          start=$(date +%s%3N)
          SPOONJOY_IMAGE="$LOCAL_IMAGE" SPOONJOY_PORT=8081 SPOONJOY_BASE_URL=http://localhost:8081 \
            docker compose -f self-host/compose.yaml -p sj-compose up -d --wait --wait-timeout 120
          end=$(date +%s%3N)
          curl -sf http://localhost:8081/health/ready
          curl -sf http://localhost:8081/ -o /dev/null
          echo "{\"composeUpToHealthyMs\": $(( end - start ))}" > "$OUT/compose.json"

      # Updating a server, as docs/self-hosting.md tells an owner to: the guide's Compose file runs the
      # last published image (latest), its owner signs up, adds a recipe and opens sign-ups, then the
      # same Compose project moves to this commit's image (what `docker compose build && docker compose
      # up -d` does) on the same data volume. The new image migrates the database on start, and the
      # owner signs back in to the same recipe and setting after a reload. On 8083.
      - name: Update a server from the last published image
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The pull signs in with a throwaway Docker config, deleted right after, so no later step
          # can push with it; only main's push steps sign in for good. (Once the package is public,
          # the pull needs no sign-in.)
          pull_config=$(mktemp -d)
          echo "$GH_TOKEN" | DOCKER_CONFIG="$pull_config" docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          DOCKER_CONFIG="$pull_config" docker pull "$IMAGE:latest"
          rm -rf "$pull_config"
          compose() {
            SPOONJOY_PORT=8083 SPOONJOY_BASE_URL=http://localhost:8083 \
              docker compose -f self-host/compose.yaml -p sj-upgrade "$@"
          }
          upgrade_half() {
            docker run --rm --network host --user "$(id -u):$(id -g)" --ipc host \
              -v "$PWD:/work" -w /work -e HOME=/tmp -e CI=true \
              -e SPOONJOY_JOURNEYS_BASE_URL=http://localhost:8083 \
              -e SPOONJOY_SELF_HOST_UPGRADE="$1" -e SPOONJOY_SELF_HOST_UPGRADE_STATE=.self-host/upgrade.json \
              mcr.microsoft.com/playwright@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f \
              node node_modules/@playwright/test/cli.js test -c playwright.self-host-fresh.config.ts e2e/self-host/upgrade.spec.ts --output "test-results-self-host-upgrade-$1"
          }
          SPOONJOY_IMAGE="$IMAGE:latest" compose up -d --wait --wait-timeout 120
          upgrade_half before
          compose logs --no-log-prefix spoonjoy > "$OUT/upgrade-before.log"
          start=$(date +%s%3N)
          SPOONJOY_IMAGE="$LOCAL_IMAGE" compose up -d --wait --wait-timeout 120
          end=$(date +%s%3N)
          upgrade_half after
          compose logs --no-log-prefix spoonjoy > "$OUT/upgrade-after.log"
          # The new image's ready line: every migration in this commit is applied, and the ones the
          # last image lacked ran on this start.
          upgrade=$(node -e '
            const fs = require("fs");
            const ready = (file) => fs.readFileSync(file, "utf8").split("\n").filter((line) => line.startsWith("{")).map((line) => JSON.parse(line)).filter((entry) => entry.event === "ready").at(-1);
            const before = ready(process.env.OUT + "/upgrade-before.log");
            const after = ready(process.env.OUT + "/upgrade-after.log");
            const files = fs.readdirSync("migrations").filter((name) => name.endsWith(".sql")).length;
            if (!before || !after) throw new Error("A server never logged its ready line.");
            if (after.migrations !== files) throw new Error(`The new image knows ${after.migrations} migrations; this commit has ${files}.`);
            if (before.migrations + after.migrationsRun !== after.migrations) throw new Error(`The last image had ${before.migrations} migrations and the new one ran ${after.migrationsRun} of ${after.migrations}.`);
            console.log(JSON.stringify({ upgradedFrom: before.version, upgradeToHealthyMs: Number(process.argv[1]), upgradeMigrationsRun: after.migrationsRun }));
          ' "$(( end - start ))")
          echo "$upgrade" | tee "$OUT/upgrade.json"
          compose down -v
          cat "$OUT/compose.json"

      - name: Stop the server
        if: always()
        run: |
          SPOONJOY_IMAGE="$LOCAL_IMAGE" docker compose -f self-host/compose.yaml -p sj-compose logs > "$OUT/compose.log" 2>&1 || true
          SPOONJOY_IMAGE="$LOCAL_IMAGE" docker compose -f self-host/compose.yaml -p sj-compose down -v || true
          SPOONJOY_IMAGE="$LOCAL_IMAGE" docker compose -f self-host/compose.yaml -p sj-upgrade logs > "$OUT/upgrade.log" 2>&1 || true
          SPOONJOY_IMAGE="$LOCAL_IMAGE" docker compose -f self-host/compose.yaml -p sj-upgrade down -v || true
          docker logs sj > "$OUT/container.log" 2>&1 || true
          docker stop sj || true
          docker logs sj-restored > "$OUT/restored.log" 2>&1 || true
          docker logs sj-jobs > "$OUT/jobs.log" 2>&1 || true
          docker stop sj-jobs || true
          docker stop sj-restored || true
          docker logs dex > "$OUT/dex.log" 2>&1 || true
          docker stop dex || true
          docker logs sj-restart > "$OUT/move-in-restart.log" 2>&1 || true
          docker rm -f sj-restart || true
          docker logs sj-lan > "$OUT/lan.log" 2>&1 || true
          docker rm -f sj-lan || true
          docker network rm sj-lan || true
          docker logs sj-mail > "$OUT/mail.log" 2>&1 || true
          docker rm -f sj-mail mailpit || true

      # The server is gone, so its passwords and sessions open nothing; the files go all the same.
      - name: Remove credentials and session files
        if: always()
        run: rm -rf .self-host e2e/.auth/journeys-*.json

      - name: Strip network logs from traces
        if: always()
        run: node scripts/sanitize-journey-traces.mjs test-results journeys-report test-results-self-host-fresh test-results-self-host-oidc test-results-self-host-restored test-results-self-host-move-in test-results-self-host-move-in-restart-before test-results-self-host-move-in-restart-after test-results-self-host-upgrade-before test-results-self-host-upgrade-after test-results-self-host-lan test-results-self-host-mail

      - name: Summary
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            const out = process.env.OUT;
            const metrics = { arch: process.env.ARCH, version: process.env.VERSION };
            for (const file of ["image", "boot", "restart", "restore", "jobs", "compose", "upgrade"]) {
              try { Object.assign(metrics, JSON.parse(fs.readFileSync(`${out}/${file}.json`, "utf8"))); } catch {}
            }
            try { metrics.memoryIdle = JSON.parse(fs.readFileSync(`${out}/memory-idle.json`, "utf8")).MemUsage; } catch {}
            fs.writeFileSync(`${out}/metrics.json`, JSON.stringify(metrics, null, 2));
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### ${process.env.ARCH}\n\n\`\`\`json\n${JSON.stringify(metrics, null, 2)}\n\`\`\`\n`);
          '
        env:
          ARCH: ${{ matrix.arch }}

      - name: Upload the report and screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: self-host-${{ matrix.arch }}
          path: |
            self-host-out/
            journeys-report/
            test-results/
            test-results-self-host-fresh/
            test-results-self-host-oidc/
            test-results-self-host-restored/
            test-results-self-host-move-in/
            test-results-self-host-move-in-restart-before/
            test-results-self-host-move-in-restart-after/
            test-results-self-host-upgrade-before/
            test-results-self-host-upgrade-after/
            test-results-self-host-lan/
            test-results-self-host-mail/
          retention-days: 30
          include-hidden-files: false

      - name: Sign in to GitHub's container registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Push this arch's image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          docker tag "$LOCAL_IMAGE" "$IMAGE:$VERSION-$ARCH"
          # GHCR sometimes answers a layer upload with "unknown blob" (run 45135166086); a retry pushes
          # only the layers that didn't land.
          for attempt in 1 2 3; do
            docker push "$IMAGE:$VERSION-$ARCH" && exit 0
            echo "Push attempt $attempt failed; trying again in $((attempt * 10)) s."
            sleep $((attempt * 10))
          done
          exit 1

  publish:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Publish latest and the version for both arches
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.image.outputs.version }}
        run: |
          [ -n "$VERSION" ]
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools create -t "$IMAGE:latest" -t "$IMAGE:$VERSION" "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-arm64"
          docker buildx imagetools inspect "$IMAGE:$VERSION" | tee -a "$GITHUB_STEP_SUMMARY"
