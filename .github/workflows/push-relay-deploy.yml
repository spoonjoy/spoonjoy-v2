name: Push Relay Deploy

# Deploys the spoonjoy-push-relay Worker (workers/push-relay, docs/push-relay.md) at its workers.dev
# address (RELAY_URL in workers/push-relay/index.ts), in production's Cloudflare account. It moves to
# push.spoonjoy.app once the spoonjoy.app zone is in that account.
#
# Its secrets: RELAY_KEY_SECRET signs relay keys and is made here once, on the first deploy, and
# never printed. APNS_KEY_P8 and APNS_KEY_ID are Apple's push key; they are copied in from the
# GitHub production environment secrets of the same names whenever both are set there, and the
# relay answers sends with "not configured" until they are. Once they are, the last step proves
# Apple takes the key: a send to a made-up device token must come back BadDeviceToken from both of
# Apple's hosts (a bad key comes back InvalidProviderToken).
#
# It deploys whatever main holds, like the uptime monitor's deploy: main only takes changes that
# passed the merge queue, whose coverage job runs the relay's tests (test/push-relay).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "workers/push-relay/**"
      - ".github/workflows/push-relay-deploy.yml"

concurrency:
  group: push-relay-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  RELAY_URL: https://spoonjoy-push-relay.mendelow-studio.workers.dev

jobs:
  guard:
    name: require trusted main
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Reject non-main workflow code
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Production credentials are restricted to refs/heads/main."
            exit 1
          fi

  deploy:
    name: deploy
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::The push relay cannot deploy: CLOUDFLARE_WORKERS_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not configured."
            exit 1
          fi

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Deploy the push relay Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy -c workers/push-relay/wrangler.json

      - name: Make the relay key secret once
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          names="$(pnpm exec wrangler secret list -c workers/push-relay/wrangler.json --format json | jq -r '.[].name')"
          if grep -qx RELAY_KEY_SECRET <<<"$names"; then
            echo "RELAY_KEY_SECRET is set."
          else
            # Made on the runner and piped straight in: it is never echoed or stored anywhere else.
            openssl rand -hex 32 | pnpm exec wrangler secret put RELAY_KEY_SECRET -c workers/push-relay/wrangler.json
            echo "Made RELAY_KEY_SECRET."
          fi

      - name: Copy Apple's push key in
        id: apns
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APNS_KEY_P8: ${{ secrets.APNS_KEY_P8 }}
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
        run: |
          set -euo pipefail
          if [ -z "${APNS_KEY_P8:-}" ] || [ -z "${APNS_KEY_ID:-}" ]; then
            echo "APNS_KEY_P8 and APNS_KEY_ID are not both set in the production environment, so the relay keeps whatever key it has."
            exit 0
          fi
          jq -n '{APNS_KEY_P8: env.APNS_KEY_P8, APNS_KEY_ID: env.APNS_KEY_ID}' | pnpm exec wrangler secret bulk -c workers/push-relay/wrangler.json
          echo "Stored APNS_KEY_P8 and APNS_KEY_ID."
          echo "stored=true" >> "$GITHUB_OUTPUT"

      - name: Confirm the relay answers at its address
        id: health
        env:
          APNS_STORED: ${{ steps.apns.outputs.stored }}
        run: |
          set -euo pipefail
          # A new address can take a moment to answer, and a version made by a secret change takes a
          # moment to reach every location, so wait for the answer this run
          # set up: registration open, and Apple's key configured when this run stored it.
          want='.ok == true and .service == "spoonjoy-push-relay" and .registration == "open"'
          if [ "${APNS_STORED:-}" = "true" ]; then want="$want and .apns == \"configured\""; fi
          for attempt in $(seq 1 40); do
            health="$(curl -fsS --max-time 15 "$RELAY_URL/health" || true)"
            if [ -n "$health" ] && jq -e "$want" <<<"$health" >/dev/null 2>&1; then
              echo "$health"
              echo "apns=$(jq -r .apns <<<"$health")" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Not ready yet ($attempt/40): ${health:-no answer}"
            sleep 10
          done
          echo "::error::$RELAY_URL/health never answered as expected."
          exit 1

      - name: Prove Apple takes the key
        if: steps.health.outputs.apns == 'configured'
        run: |
          set -euo pipefail
          key="$(curl -fsS -X POST "$RELAY_URL/v1/servers" -H 'content-type: application/json' --data '{"baseUrl":"https://github.com/spoonjoy/spoonjoy-v2/actions"}' | jq -r .relayKey)"
          echo "::add-mask::$key"
          token="$(printf '0%.0s' $(seq 64))"
          for environment in development production; do
            answer="$(curl -fsS -X POST "$RELAY_URL/v1/send" -H "authorization: Bearer $key" -H 'content-type: application/json' \
              --data "{\"token\":\"$token\",\"environment\":\"$environment\",\"payload\":{\"aps\":{\"alert\":\"Push relay check\"}}}")"
            echo "$environment: $answer"
            jq -e '.status == 400 and .reason == "BadDeviceToken"' <<<"$answer" >/dev/null || {
              echo "::error::Apple's $environment host did not take the relay's key: expected 400 BadDeviceToken for a made-up token."
              exit 1
            }
          done
