name: Storybook

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

# A newer push to a pull request cancels that pull request's run. Main runs share one group so
# Storybook deploys land in order, and are never cancelled in progress; merge-queue groups have a
# ref of their own.
concurrency:
  group: storybook-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  build-storybook:
    name: ${{ github.event_name == 'workflow_dispatch' && 'manual-build-storybook' || 'build-storybook' }}
    # The installed HX includes the swipe-actions rounding fix, so Storybook shares the pinned
    # browser image and installs neither browsers nor Ubuntu packages.
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f # v1.64.0-noble
      options: --user 1001 -v /usr/bin/zstd:/usr/bin/zstd:ro
    permissions:
      contents: read
      deployments: write
    
    steps:
      # Depth 2 keeps a pull request's base (the merge commit's first parent) for the Ouro UI test scope.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 2

      - name: 📦 Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: ""

      - name: 📦 Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.1 --activate
      
      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      
      - name: 🔧 Generate Prisma client
        run: pnpm prisma:generate
      
      # On a pull request or a merge-queue group, the Ouro UI tests and specs below run only when a
      # change can reach them; otherwise their result is the base commit's, which passed them. On a
      # pull request, the Storybook build and story check also run only when a story, Storybook's
      # preview or a file Storybook reads changed, or the Ouro UI tests run; otherwise the job ends
      # here and build-storybook passes on the base commit's result (the merge queue builds it
      # whole). It runs the base commit's copy of scripts/storybook-scope.mjs, so a change cannot
      # set its own scope, and runs everything when the base has no copy or doesn't say.
      - name: 🧭 Ouro UI test scope
        id: scope
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "merge_group" ]; then
            base="$MERGE_GROUP_BASE"
            git fetch --quiet --no-tags --depth=1 origin "$base"
          else
            base="$(git rev-parse HEAD^1)"
          fi
          if git show "$base:scripts/storybook-scope.mjs" > "$RUNNER_TEMP/storybook-scope.mjs" 2>/dev/null; then
            SPOONJOY_OURO_BASE="$base" node "$RUNNER_TEMP/storybook-scope.mjs"
          else
            echo "ouro=true" >> "$GITHUB_OUTPUT"
            echo "The base has no scripts/storybook-scope.mjs, so the Ouro UI tests run."
          fi

      - name: 📚 Build Storybook
        if: steps.scope.outputs.storybook != 'false'
        run: pnpm build-storybook

      # Ouro UI (app/components/ouro, installed from its shadcn registry) ships its own tests. They
      # run here, beside the Storybook they use, on every push to main and on each pull request and
      # merge-queue run its scope above selects: the Vitest browser tests in Chromium, WebKit and a touch phone with 100% coverage of
      # the Ouro UI files (vitest.ouro.config.ts), then the Playwright specs in e2e/ouro against
      # the Storybook just built (playwright.ouro.config.ts). Both run under the warning policy.
      - name: 🧪 Ouro UI browser tests and coverage
        if: steps.scope.outputs.ouro != 'false'
        run: pnpm run verify:clean:test:ouro

      # Ouro UI's tests that race the clock on a shared runner (test/ouro/timing-quarantine.ts says
      # which and why) run here instead of in the step above, so they report without failing an
      # unrelated pull request. A failure here shows on the step and leaves the job green.
      - name: ⏱️ Ouro UI timing tests (not required)
        if: ${{ !cancelled() && steps.scope.outputs.ouro != 'false' }}
        continue-on-error: true
        run: pnpm run verify:clean:test:ouro:timing

      - name: 🎭 Ouro UI specs against the built Storybook
        if: steps.scope.outputs.ouro != 'false'
        run: |
          python3 -m http.server 6006 --bind 127.0.0.1 --directory storybook-static > "$RUNNER_TEMP/storybook-server.log" 2>&1 &
          for _ in $(seq 50); do curl -sf http://127.0.0.1:6006/iframe.html > /dev/null && break; sleep 0.2; done
          OURO_E2E_URL=http://127.0.0.1:6006 pnpm run verify:clean:test:e2e:ouro

      # Every story, in the light and the dark theme, through the journeys' accessibility gate
      # (e2e/storybook/accessibility.spec.ts): any axe finding fails, including a check axe could
      # not decide that a pixel measurement does not settle. It runs even when the specs above fail.
      - name: ♿ Story accessibility in both themes
        if: ${{ !cancelled() && steps.scope.outputs.storybook != 'false' }}
        run: |
          python3 -m http.server 6007 --bind 127.0.0.1 --directory storybook-static > "$RUNNER_TEMP/storybook-a11y-server.log" 2>&1 &
          for _ in $(seq 50); do curl -sf http://127.0.0.1:6007/iframe.html > /dev/null && break; sleep 0.2; done
          STORYBOOK_URL=http://127.0.0.1:6007 pnpm run verify:clean:test:e2e:storybook-a11y

      - name: Prepare Cloudflare Pages deploy directory
        if: github.ref == 'refs/heads/main'
        run: |
          rm -rf storybook-pages-deploy
          mkdir -p storybook-pages-deploy
          mv storybook-static storybook-pages-deploy/storybook-static
          printf '%s\n' '{' '  "name": "spoonjoy-storybook",' '  "pages_build_output_dir": "storybook-static"' '}' > storybook-pages-deploy/wrangler.json

      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: storybook-pages-deploy
          packageManager: npm
          command: pages deploy --project-name=spoonjoy-storybook --branch=${{ github.ref_name }} --commit-hash=${{ github.sha }} --commit-dirty=true
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
