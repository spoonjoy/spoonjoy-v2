name: Isolated touch host candidate qualification
on:
  push:
    branches: [probe/ouro-touch-host-20261016]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        scope: [full, preload]
    env:
      VITE_HOST_CONTROL: ${{ matrix.scope == 'default' && 'default' || 'roomy' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - run: corepack enable && corepack prepare pnpm@10.28.1 --activate
      - run: pnpm install --frozen-lockfile
      - name: Record exact source and protected inputs
        run: |
          git rev-parse HEAD > touch-host-source.txt
          python3 - <<'PY'
          import subprocess
          paths = subprocess.check_output([
              "git", "diff", "--name-only", "7f50e38bc1b838319bc67c11299e4a58e3e42b2b", "--",
              "app", "vitest.ouro.config.ts", "package.json", "pnpm-lock.yaml",
          ], text=True).splitlines()
          assert paths == [
              "app/components/ouro/menu/menu.test.tsx",
              "app/components/ouro/menu/menu.tsx",
              "app/lib/ouro/testing/commands.touch.test.ts",
              "app/lib/ouro/testing/vitest.ts",
          ], paths
          pristine = subprocess.check_output([
              "git", "diff", "--name-only", "7f50e38bc1b838319bc67c11299e4a58e3e42b2b", "--",
              "test/ouro/shopping-removal.test.tsx", "e2e", "playwright.ouro.config.ts", "vitest.ouro.config.ts",
          ], text=True).splitlines()
          assert pristine == [], pristine
          PY
          sha=$(node -p 'require("./.github/touch-host-source.json").upstreamCommit')
          curl --fail --silent --show-error \
            "https://raw.githubusercontent.com/ourostack/ouro-ui/$sha/registry/ouro/lib/ouro/testing/vitest.ts" \
            -o "$RUNNER_TEMP/upstream-touch-provider.ts"
          cmp "$RUNNER_TEMP/upstream-touch-provider.ts" app/lib/ouro/testing/vitest.ts
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          manifest = json.loads(Path(".github/touch-host-source.json").read_text())
          assert hashlib.sha256(Path(manifest["consumerPath"]).read_bytes()).hexdigest() == manifest["sha256"]
          fixture = manifest["fixture"]
          assert hashlib.sha256(Path(fixture["consumerPath"]).read_bytes()).hexdigest() == fixture["consumerSha256"]
          PY
          curl --fail --silent --show-error \
            "https://raw.githubusercontent.com/ourostack/ouro-ui/$sha/registry/ouro/lib/ouro/testing/commands.touch.test.ts" \
            -o "$RUNNER_TEMP/upstream-touch-fixture.ts"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os
          fixture = json.loads(Path(".github/touch-host-source.json").read_text())["fixture"]
          upstream = Path(os.environ["RUNNER_TEMP"], "upstream-touch-fixture.ts").read_bytes()
          assert hashlib.sha256(upstream).hexdigest() == fixture["upstreamSha256"]
          normalized = upstream.replace(b"@/registry/ouro/lib/ouro/", b"~/lib/ouro/")
          assert normalized == Path(fixture["consumerPath"]).read_bytes()
          PY
          curl --fail --silent --show-error \
            "https://raw.githubusercontent.com/ourostack/ouro-ui/$sha/registry/ouro/components/ouro/menu/menu.test.tsx" \
            -o "$RUNNER_TEMP/upstream-menu-test.tsx"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os
          fixture = json.loads(Path(".github/touch-host-source.json").read_text())["menuTest"]
          upstream = Path(os.environ["RUNNER_TEMP"], "upstream-menu-test.tsx").read_bytes()
          assert hashlib.sha256(upstream).hexdigest() == fixture["upstreamSha256"]
          normalized = upstream.replace(b"@/registry/ouro/components/ouro/", b"~/components/ouro/").replace(b"@/registry/ouro/lib/ouro/", b"~/lib/ouro/")
          assert normalized == Path(fixture["consumerPath"]).read_bytes()
          assert hashlib.sha256(normalized).hexdigest() == fixture["consumerSha256"]
          PY
          curl --fail --silent --show-error \
            "https://raw.githubusercontent.com/ourostack/ouro-ui/$sha/registry/ouro/components/ouro/menu/menu.tsx" \
            -o "$RUNNER_TEMP/upstream-menu.tsx"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os
          fixture = json.loads(Path(".github/touch-host-source.json").read_text())["menu"]
          upstream = Path(os.environ["RUNNER_TEMP"], "upstream-menu.tsx").read_bytes()
          assert hashlib.sha256(upstream).hexdigest() == fixture["upstreamSha256"]
          normalized = upstream.replace(b"@/registry/ouro/components/ouro/", b"~/components/ouro/").replace(b"@/registry/ouro/lib/ouro/", b"~/lib/ouro/")
          assert normalized == Path(fixture["consumerPath"]).read_bytes()
          assert hashlib.sha256(normalized).hexdigest() == fixture["consumerSha256"]
          PY
      - name: Record binding and one-variable mutation
        run: |
          git diff 7f50e38bc1b838319bc67c11299e4a58e3e42b2b -- app/lib/ouro/testing/vitest.ts > touch-host-provider.diff
          git diff 7f50e38bc1b838319bc67c11299e4a58e3e42b2b -- app/lib/ouro/testing/commands.touch.test.ts > touch-host-fixture.diff
          node --input-type=module - <<'JS' > touch-host-projects.json
          import { ouroTestProjects } from "./app/lib/ouro/testing/vitest.ts";
          const projects = ouroTestProjects({
            css: "./app/styles/tailwind.css",
            ...(process.env.VITE_HOST_CONTROL === "roomy" ? { page: { width: 1600, height: 1200 } } : {}),
          });
          console.log(JSON.stringify(projects.map(({ test }) => ({
            name: test.name,
            logical: test.browser.viewport,
            context: test.browser.provider.options.contextOptions,
          })), null, 2));
          JS
      - run: pnpm exec tsc -p .github/touch-host-proof.tsconfig.json --pretty false
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: Native SDK controls under the selected host
        if: matrix.scope == 'default' || matrix.scope == 'roomy'
        run: |
          pnpm exec vitest run --config .github/touch-host-proof.config.ts --project ouro-touch \
            app/lib/ouro/testing/commands.touch.test.ts \
            --reporter=verbose --reporter=json --outputFile=touch-host-tests.json 2>&1 | tee touch-host-native.log
      - name: Complete public Menu ownership, dismissal and navigation checks
        if: matrix.scope == 'menu'
        run: |
          pnpm exec vitest run --config vitest.ouro.config.ts --project ouro-chromium --project ouro-webkit \
            app/components/ouro/menu/menu.test.tsx \
            --reporter=verbose --reporter=json --outputFile=touch-host-tests.json 2>&1 | tee touch-host-native.log
      - name: Independent native geometry and wrong-target controls
        if: matrix.scope == 'roomy'
        run: |
          pnpm exec vitest run --config .github/touch-host-proof.config.ts --project ouro-touch \
            test/ouro/touch-host.probe.touch.test.tsx \
            --reporter=verbose --reporter=json --outputFile=touch-host-geometry-tests.json 2>&1 | tee touch-host-geometry.log
      - name: Generate Prisma and build actual Storybook
        if: matrix.scope == 'full' || matrix.scope == 'preload'
        run: pnpm prisma:generate && pnpm build-storybook
      - name: Pristine actual consumer browser suite and strict coverage
        if: matrix.scope == 'full'
        run: |
          node scripts/run-with-warning-policy.mjs -- pnpm exec vitest run --config vitest.ouro.config.ts --coverage \
            --exclude test/ouro/touch-host.probe.touch.test.tsx \
            --reporter=verbose --reporter=json --outputFile=touch-host-tests.json 2>&1 | tee touch-host-native.log
      - name: Pristine component specs or isolated preload diagnostic; warning fixture unchanged
        if: matrix.scope == 'full' || matrix.scope == 'preload'
        run: |
          python3 -m http.server 6006 --bind 127.0.0.1 --directory storybook-static > "$RUNNER_TEMP/storybook-server.log" 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for _ in $(seq 50); do curl -sf http://127.0.0.1:6006/iframe.html > /dev/null && break; sleep 0.2; done
          curl --fail --silent http://127.0.0.1:6006/iframe.html > /dev/null
          if [ "${{ matrix.scope }}" = full ]; then
            OURO_E2E_URL=http://127.0.0.1:6006 pnpm run verify:clean:test:e2e:ouro 2>&1 | tee touch-host-playwright.log
          else
            OURO_E2E_URL=http://127.0.0.1:6006 pnpm exec playwright test -c .github/preload-proof.config.ts \
              --repeat-each=10 --trace=retain-on-failure 2>&1 | tee preload-playwright.log
          fi
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: touch-host-${{ matrix.scope }}-qualification
          path: |
            touch-host-source.txt
            touch-host-provider.diff
            touch-host-fixture.diff
            touch-host-projects.json
            touch-host-tests.json
            touch-host-native.log
            touch-host-geometry-tests.json
            touch-host-geometry.log
            touch-host-playwright.log
            preload-playwright.log
            test-results/
            keyboard-*.json
            keyboard-*.log
            .github/touch-host-source.json
            coverage/
            playwright-report/
            .vitest/attachments/
            test/ouro/__screenshots__/
          if-no-files-found: error
          include-hidden-files: true
