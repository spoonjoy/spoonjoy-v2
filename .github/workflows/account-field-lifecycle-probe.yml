name: Account field lifecycle paired diagnostic
on:
  push:
    branches: [probe/account-field-lifecycle-20261017]
permissions:
  contents: read
jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        cleanup-first: ["0", "1"]
    env:
      PRISMA_HIDE_UPDATE_MESSAGE: "1"
      FIELD_CLEANUP_FIRST: ${{ matrix.cleanup-first }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"
      - run: corepack enable && corepack prepare pnpm@10.28.1 --activate
      - name: Restore only after actual missing CI tool
        run: |
          if [ ! -x node_modules/.bin/vitest ]; then
            printf '%s\n' 'Fresh CI checkout has no Vitest executable; restoring authoritative frozen dependencies.'
            pnpm install --frozen-lockfile
          fi
      - run: DATABASE_URL=file:./test.db pnpm exec prisma db push --skip-generate
      - name: Run unchanged field-error assertions with teardown instrumentation
        run: |
          set +e
          pnpm exec vitest run test/routes/account-settings.test.tsx --testNamePattern="field error display in forms" --reporter=verbose > "$RUNNER_TEMP/field-lifecycle.log" 2>&1
          result=$?
          cat "$RUNNER_TEMP/field-lifecycle.log"
          printf '%s\n' "$result" > "$RUNNER_TEMP/field-lifecycle-exit.txt"
          if [ "$FIELD_CLEANUP_FIRST" = "0" ]; then
            test "$result" -ne 0
            grep -q 'FIELD_LIFECYCLE_DIAGNOSTIC' "$RUNNER_TEMP/field-lifecycle.log"
            grep -q 'useTransitionStatus' "$RUNNER_TEMP/field-lifecycle.log"
          else
            test "$result" -eq 0
            ! grep -q 'FIELD_LIFECYCLE_DIAGNOSTIC' "$RUNNER_TEMP/field-lifecycle.log"
          fi
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: field-lifecycle-${{ matrix.cleanup-first }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/field-lifecycle.log
            ${{ runner.temp }}/field-lifecycle-exit.txt
          if-no-files-found: error
