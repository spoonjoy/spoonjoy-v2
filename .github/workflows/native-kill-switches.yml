name: Native Kill Switches

# Switches Spoonjoy Apple app features off, or back on, in production without an app build
# (scripts/native-kill-switches.ts; docs/deployment.md, "Native kill switches"). Mode report reads
# production's GET /api/v1/native/config. Mode set stores the switches input as the Worker secret
# SPOONJOY_NATIVE_KILL_SWITCHES in one new Worker version that copies the one production runs and keeps
# its source tag, so the next Production Deploy accepts it, then checks production answers it.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: report reads only; set stores the switches and deploys them
        required: true
        default: report
        type: choice
        options:
          - report
          - set
      switches:
        description: "For set: none, a comma-separated list (cook-session-sync,spotlight-indexing), or JSON of feature to reason"
        required: false
        default: none
        type: string

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  guard:
    name: require trusted main
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Reject non-main workflow code
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Production credentials are restricted to refs/heads/main."
            exit 1
          fi

  # Reads only: no production environment, no secrets, and no shared concurrency group, so a queued
  # report never takes the place of a set that is waiting its turn.
  report:
    name: report
    needs: guard
    if: inputs.mode == 'report'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Report production's native kill switches
        run: pnpm exec tsx scripts/native-kill-switches.ts report

  set:
    name: set
    needs: guard
    if: inputs.mode == 'set'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    # The same group as Production Image Key: both make production Worker versions, so they never run at once.
    concurrency:
      group: production-image-key
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # A new Worker version copies the newest one, so never run while a release may be uploading.
      - name: Wait for any in-flight Production Deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            busy="$(gh run list --workflow production-deploy.yml --repo "$GITHUB_REPOSITORY" --json status --jq '[.[] | select(.status != "completed")] | length')"
            if [ "$busy" = "0" ]; then
              echo "No Production Deploy is running."
              exit 0
            fi
            echo "A Production Deploy is running; checking again in 30s ($attempt/40)."
            sleep 30
          done
          echo "::error::A Production Deploy was still running after 20 minutes."
          exit 1

      - name: Store the switches in production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKERS_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          NATIVE_KILL_SWITCHES: ${{ inputs.switches }}
        run: pnpm exec tsx scripts/native-kill-switches.ts set
