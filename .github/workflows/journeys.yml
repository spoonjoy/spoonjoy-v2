name: Journeys

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Daily signed-in QA run against main, off-peak UTC. Scheduled runs always execute on the
    # default branch (main), so no explicit ref is needed here.
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      suite:
        description: Which suite to run
        type: choice
        options:
          - journeys
          - explore
        default: journeys

permissions:
  contents: read

defaults:
  run:
    shell: bash

# QA is single-tenant, and runs take their turn through the FIFO queue in the qa-turn job below,
# not through a shared concurrency group: GitHub keeps one running and one pending run per group
# and cancels the older pending run whenever a newer one queues, which silently dropped runs.
# The only shared group left is per pull request, and it never cancels a run in progress, so a
# run already on QA always finishes, including its rotate and cleanup steps. A newer push to the
# same pull request still replaces that pull request's pending run (GitHub's one-pending rule).
# Every other run (pushes to main, the schedule, manual runs) gets a group of its own.
concurrency:
  group: journeys-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  PRISMA_HIDE_UPDATE_MESSAGE: "1"
  SPOONJOY_JOURNEYS_BASE_URL: https://spoonjoy-v2-qa.mendelow-studio.workers.dev
  SPOONJOY_QA_CREDENTIALS: ${{ github.workspace }}/.journeys/credentials.json
  # Push, pull_request, and the daily schedule always run the journeys suite; only a
  # workflow_dispatch can choose explore. Everything else (deploy, seed, rotate, sanitise,
  # gated upload, cleanup, concurrency) is shared between the two suites.
  SUITE: ${{ github.event_name == 'workflow_dispatch' && inputs.suite || 'journeys' }}

jobs:
  fork-notice:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - run: echo "::warning::Journeys need QA credentials and do not run for fork pull requests. A maintainer must re-run them from a same-repo branch."

  # One run at a time on the shared QA mirror, first in, first out. scripts/wait-for-qa-turn.mjs
  # waits until no other active Journeys run of this repository is ahead of this one (ordered by
  # the start of each run's current attempt, then by run id, so a re-run joins the back of the
  # queue) and none behind it already holds QA. Fork pull request runs never enter the queue. It
  # fails after 330 minutes rather than proceed without its turn; the job timeout leaves 15 minutes
  # more for checkout, setup and that clear failure message. The run keeps QA until it completes.
  # Known residual race: the Actions API can lag by a few seconds, so two runs that become
  # eligible at the same moment could both see a free QA. The worst case is a contended, failed
  # run that needs a fresh push, never a skipped required check, because QA holds only disposable data.
  qa-turn:
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    name: wait for QA
    runs-on: ubuntu-latest
    timeout-minutes: 345
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: Wait for this run's turn on QA
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/wait-for-qa-turn.mjs

  # `journeys` is the required check. It runs even when qa-turn failed or timed out (a skipped
  # required check would count as passing) and then fails in its first step. The queue only
  # orders runs: it reads the Actions API, which can lag, so before deploying the job also takes
  # an atomic lock in QA's own D1 (scripts/qa-lock.mjs) and releases it as its last step. Steps
  # that touch QA after a failure (tail, rotate, cleanup) run only while this run holds the lock.
  # The job timeout stays below the lock's 45-minute expiry.
  journeys:
    needs: qa-turn
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    name: journeys
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Require this run's turn on QA
        if: needs.qa-turn.result != 'success'
        env:
          QA_TURN_RESULT: ${{ needs.qa-turn.result }}
        run: |
          echo "::error::This run did not get its turn on QA (the wait for QA job ended as: ${QA_TURN_RESULT}). Journeys fail instead of sharing QA or reporting as skipped. Re-run once the runs ahead have finished."
          exit 1

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: Require Cloudflare credentials
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are required. Journeys fail closed."
            exit 1
          fi

      - name: Activate pnpm
        run: |
          node scripts/warning-gate.ts -- corepack enable
          node scripts/warning-gate.ts -- corepack prepare pnpm@10.28.1 --activate

      - name: Install dependencies
        run: node scripts/warning-gate.ts -- pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: node scripts/warning-gate.ts -- pnpm prisma:generate

      - name: Check journey house rules
        run: node scripts/warning-gate.ts -- pnpm run check:journeys

      # Passwords are Secret values that fill() and toHaveValue() don't accept
      # (e2e/journeys/support/secret.ts); this typecheck of every Playwright suite under e2e/ is
      # what enforces that. pnpm run typecheck (and so ci.yml) runs it too; it runs here as well
      # so the check happens before any password reaches QA.
      - name: Typecheck the journeys
        run: node scripts/warning-gate.ts -- pnpm exec tsc -p tsconfig.e2e.json

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      # The atomic step: one D1 statement takes the lock only if it is free or expired, and the
      # row is read back to confirm this run and attempt hold it. Waits up to 10 minutes.
      - name: Take the QA lock
        id: qa-lock
        run: node scripts/qa-lock.mjs acquire --target-env qa

      - name: Deploy this build to QA
        run: pnpm run deploy:qa

      # Workers-side evidence for every run: stream the QA Worker's invocation log while the
      # suite runs, so an outcome the browser can't see (exceededCpu, exceededMemory, an
      # exception) is on record. The raw stream holds request headers (cookies), so it stays in
      # .worker-tail/, outside every uploaded path, and is deleted once summarised. Observability
      # must never fail a run, so this step and the summary step are non-fatal.
      - name: Start QA Worker tail
        continue-on-error: true
        run: |
          mkdir -p .worker-tail
          nohup ./node_modules/.bin/wrangler tail spoonjoy-v2-qa --format json \
            > .worker-tail/tail.json 2> .worker-tail/tail.err < /dev/null &
          echo $! > .worker-tail/pid
          # The JSON format prints no "connected" line; give the socket a moment to open.
          sleep 10 || true

      - name: Seed the QA kitchen
        run: |
          mkdir -p .journeys
          pnpm run seed:qa:kitchen -- --credentials-out "$SPOONJOY_QA_CREDENTIALS"
          for p in chef friend newbie; do
            echo "::add-mask::$(jq -r ".${p}.password" "$SPOONJOY_QA_CREDENTIALS")"
          done
          while IFS= read -r password; do
            echo "::add-mask::$password"
          done < <(jq -r '(.scratch[]?, .scratchDesktop[]?) | .password' "$SPOONJOY_QA_CREDENTIALS")

      - name: Run test suite
        run: |
          if [ "$SUITE" = "explore" ]; then
            pnpm run explore:qa
          else
            pnpm run test:journeys
          fi

      # Reduce the Worker tail to a small summary inside test-results/ (uploaded with either
      # report) with scripts/summarize-worker-tail.jq, an allowlist locked by
      # test/scripts/summarize-worker-tail.test.ts. Per invocation it keeps the outcome, the
      # path without its query, method, status, CPU and wall time and redacted exception
      # messages, for non-ok invocations, the first 20 with exceptions and the 25 slowest,
      # plus p50/p95/max wall and CPU time per path pattern, and the routes whose p95 CPU time is
      # over the 10 ms per-request budget (printed as warnings). No header, cookie, body or log line
      # is copied. If the tail had already exited when the suite finished, or recorded nothing,
      # the summary says `complete: false` and the log warns: that is no evidence, not a clean
      # run. The raw stream is then deleted.
      - name: Stop QA Worker tail and summarise it
        if: always() && steps.qa-lock.outcome == 'success'
        continue-on-error: true
        run: |
          mkdir -p .worker-tail test-results
          tail_alive=false
          if [ -f .worker-tail/pid ]; then
            if kill -0 "$(cat .worker-tail/pid)" 2>/dev/null; then tail_alive=true; fi
            kill "$(cat .worker-tail/pid)" 2>/dev/null || true
            sleep 2 || true
            kill -9 "$(cat .worker-tail/pid)" 2>/dev/null || true
          fi
          : > .worker-tail/events.ndjson
          if [ -f .worker-tail/tail.json ]; then
            # Keep only the JSON events (from the first line that opens an object), and stop at
            # a value cut off by the kill instead of failing on it.
            sed -n '/^{/,$p' .worker-tail/tail.json | jq -c '.' > .worker-tail/events.ndjson 2>/dev/null || true
          fi
          jq -s --argjson tailAliveAtStop "$tail_alive" -f scripts/summarize-worker-tail.jq \
            .worker-tail/events.ndjson > test-results/worker-tail-summary.json || true
          if [ -s .worker-tail/tail.err ]; then tail -n 20 .worker-tail/tail.err || true; fi
          rm -rf .worker-tail
          if [ "$(jq -r '.complete' test-results/worker-tail-summary.json 2>/dev/null)" != "true" ]; then
            echo "::warning::The QA Worker tail is incomplete (the tail exited before the suite finished, or recorded no events). Treat worker-tail-summary.json as no evidence, not as a run without Worker-side failures."
          fi
          jq '{ complete, tailAliveAtStop, totalInvocations, outcomes, nonOk: (.nonOkInvocations | length), slowestPaths: (.byPath | .[0:5]) }' \
            test-results/worker-tail-summary.json || true
          # One warning per route whose p95 CPU time is over the per-request budget (the Workers
          # Free plan's 10 ms CPU limit). Non-fatal for now. A path is reduced to URL-safe
          # characters before it reaches a workflow command.
          jq -r '.budget.cpuTimeP95Ms as $budget | .budget.overBudget[]
            | "::warning::CPU budget: \(.path | gsub("[^A-Za-z0-9/._:~-]"; "?")) has p95 CPU \(.cpuTime.p95) ms (max \(.cpuTime.max) ms over \(.count) requests), over the \($budget) ms budget."' \
            test-results/worker-tail-summary.json || true

      # The report and traces can contain this run's persona and scratch-user passwords, so
      # before anything is uploaded: rotate the kitchen personas to fresh passwords nobody
      # keeps (no --credentials-out), same as before, and --rotate additionally invalidates
      # every existing scratch-namespace user's password in place (NULLs it out) instead of
      # minting a fresh scratch batch, so there is never a new, never-yet-invalidated scratch
      # password for the upload to carry. Every password in the artifact is then already dead.
      # It also revokes this run's session cookies: scratch users get their sessionVersion
      # bumped, and the personas are re-created at a newer session version.
      # Runs even if the journeys failed; if the seed step never ran, re-seeding is harmless.
      - name: Rotate persona passwords
        id: rotate-passwords
        if: always() && steps.qa-lock.outcome == 'success'
        run: pnpm run seed:qa:kitchen -- --rotate

      - name: Clean up disposable QA data
        id: cleanup-qa-data
        if: always() && steps.qa-lock.outcome == 'success'
        run: node scripts/warning-gate.ts -- pnpm run cleanup:remote:qa:apply

      - name: Remove credentials and session files
        if: always()
        run: rm -rf .journeys e2e/.auth/journeys-*.json .worker-tail

      # Session cookies last 30 days and survive re-seeding and logout. They are revocable
      # (User.sessionVersion), and "Rotate persona passwords" above already revoked every persona
      # and scratch-user session from this run, but the cookies are still stripped here as
      # defence in depth. Remove the network log (every
      # Cookie / Set-Cookie / Authorization header, plus the request and response bodies only
      # it references) from every trace, including the copies inside the HTML report, and
      # redact storage-state and cookie values from the remaining trace events, password inputs'
      # values from trace DOM snapshots, and password textboxes' values from page snapshots
      # (error-context.md and its copies). Fails if a network entry or unredacted value is left.
      # journeys-report/ and explore-report/ are each other's sibling: only the directory the
      # suite that actually ran produced exists, and sanitize-journey-traces.mjs skips any
      # directory that does not exist, so passing both is harmless regardless of $SUITE.
      - name: Strip network logs from traces
        id: strip-traces
        if: always()
        run: node scripts/sanitize-journey-traces.mjs test-results journeys-report explore-report

      # The artifact is public to any signed-in GitHub user. It can contain:
      #   - journeys-report/ or explore-report/: the HTML report, whose step titles include
      #     typed values (never a password: passwords are Secret values that only fillSecret can
      #     type, which keeps them out of step titles; the journeys typecheck enforces it), plus
      #     failure screenshots, videos, error context and copies of the failure traces
      #     (explore-report/ additionally holds summary.json and a full-page screenshot per
      #     route visited);
      #   - test-results/: per-failure traces, videos, screenshots and error context, plus
      #     worker-tail-summary.json (Worker outcomes, paths without queries, statuses, timings and
      #     exception names plus redacted, capped messages only; no headers, cookies or bodies).
      # Traces keep the action log (with typed values other than secrets), DOM snapshots,
      # screencast frames and test source. A DOM snapshot records every input's value and the
      # error context prints a textbox's value, so "Strip network logs from traces" also redacts
      # password inputs' values from every trace snapshot and password textboxes' values from
      # every page snapshot (error-context.md, and its copies in traces and the report), and
      # fails if one is left. It is safe to publish because (1) "Rotate persona passwords" has already
      # replaced every persona password, invalidated every scratch-user password it contains
      # and revoked every persona and scratch-user session from the run, (2) "Clean up
      # disposable QA data" has removed the (now-invalidated) scratch
      # users and every other disposable row, and (3) "Strip network logs from traces" has
      # removed network logs and redacted session cookies and storage state from every trace.
      # Upload runs only if all three steps succeeded, and only the report matching $SUITE
      # actually exists; the credentials file and session files are deleted above and are
      # never in the uploaded paths.
      - name: Upload journeys report
        if: ${{ !cancelled() && env.SUITE == 'journeys' && steps.rotate-passwords.outcome == 'success' && steps.cleanup-qa-data.outcome == 'success' && steps.strip-traces.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: journeys-report
          path: |
            journeys-report/
            test-results/
          retention-days: 30
          include-hidden-files: false

      - name: Upload explore report
        if: ${{ !cancelled() && env.SUITE == 'explore' && steps.rotate-passwords.outcome == 'success' && steps.cleanup-qa-data.outcome == 'success' && steps.strip-traces.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: explore-report
          path: |
            explore-report/
            test-results/
          retention-days: 30
          include-hidden-files: false

      # Last step, so QA stays locked through rotate and cleanup. Deletes the lock only if this
      # run and attempt hold it; a failed release only warns, and the lock then expires.
      - name: Release the QA lock
        if: always() && steps.qa-lock.outcome == 'success'
        run: node scripts/qa-lock.mjs release --target-env qa
