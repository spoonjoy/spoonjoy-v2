name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact branch-head SHA for an authorized report-only rollback CI run
        required: true
        type: string
      csp_report_only_break_glass:
        description: Type ACK_REPORT_ONLY_CSP_ROLLBACK to authorize report-only preflight for this exact SHA
        required: true
        type: string

# Every CI job only reads the repository; nothing here needs a write-scoped GITHUB_TOKEN.
permissions:
  contents: read

defaults:
  run:
    shell: bash

# A newer push to the same pull request cancels that pull request's CI run in progress: its result
# is already stale, and the runner pool (20 concurrent jobs) is shared with main's CI and the
# production deploy. Every other run (main pushes, merge-queue groups, dispatches) gets a group of
# its own and is never cancelled.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  PRISMA_HIDE_UPDATE_MESSAGE: "1"
  CI_SOURCE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.sha }}
  SPOONJOY_CSP_REPORT_ONLY_BREAK_GLASS: ${{ github.event_name == 'workflow_dispatch' && inputs.csp_report_only_break_glass || '' }}

jobs:
  # After a merge-queue merge, main's new commit is exactly the commit the queue's CI run already
  # tested, with this same workflow file. On a push to main, queue-tested asks GitHub whether that
  # merge-queue run passed every canonical job; if it did, the four jobs below skip on this push and
  # the production deploy uses the queue's run as its evidence. A push that bypassed the queue, a
  # missing, failed or partly skipped queue run, or any lookup error runs full CI. Pull requests,
  # merge-queue groups and dispatches skip queue-tested and always run full CI.
  queue-tested:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      tested: ${{ steps.lookup.outputs.tested }}

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ env.CI_SOURCE_SHA }}
          persist-credentials: false

      - name: 📦 Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: 🔐 Validate CI invocation
        run: node scripts/warning-gate.ts -- node scripts/workflow-security.mjs validate-ci-invocation

      - name: 🔎 Ask whether the merge queue already tested this commit
        id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/workflow-security.mjs queue-tested-ci

  advisory:
    name: ${{ github.event_name == 'workflow_dispatch' && 'report-only-advisory' || 'advisory' }}
    needs: queue-tested
    if: ${{ !cancelled() && needs.queue-tested.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ env.CI_SOURCE_SHA }}
          persist-credentials: false

      - name: 📦 Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: 🔐 Validate CI invocation
        run: node scripts/warning-gate.ts -- node scripts/workflow-security.mjs validate-ci-invocation

      - name: 📦 Activate pnpm
        run: |
          node scripts/warning-gate.ts -- corepack enable
          node scripts/warning-gate.ts -- corepack prepare pnpm@10.28.1 --activate

      - name: 🔒 Install pinned OSV-Scanner
        env:
          OSV_SCANNER_VERSION: v2.3.8
          OSV_SCANNER_TAG_SHA: 408fcd6f8707999a29e7ba45e15809764cf24f67
          OSV_SCANNER_LINUX_AMD64_SHA256: bc98e15319ed0d515e3f9235287ba53cdc5535d576d24fd573978ecfe9ab92dc
        run: |
          node scripts/warning-gate.ts -- mkdir -p .cache/osv-scanner
          node scripts/warning-gate.ts -- curl -fsSL --retry 3 --retry-delay 2 "https://api.github.com/repos/google/osv-scanner/git/ref/tags/${OSV_SCANNER_VERSION}" -o .cache/osv-scanner/tag.json
          node scripts/warning-gate.ts -- jq -e --arg expected "$OSV_SCANNER_TAG_SHA" '.object | select(.type == "commit" and .sha == $expected)' .cache/osv-scanner/tag.json
          node scripts/warning-gate.ts -- curl -fsSL --retry 3 --retry-delay 2 "https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64" -o .cache/osv-scanner/osv-scanner
          printf '%s  %s\n' "$OSV_SCANNER_LINUX_AMD64_SHA256" ".cache/osv-scanner/osv-scanner" > .cache/osv-scanner/checksums.txt
          node scripts/warning-gate.ts -- sha256sum -c .cache/osv-scanner/checksums.txt
          node scripts/warning-gate.ts -- chmod +x .cache/osv-scanner/osv-scanner
          node scripts/warning-gate.ts -- .cache/osv-scanner/osv-scanner --version

      - name: 📥 Install advisory dependencies without lifecycle scripts
        run: node scripts/warning-gate.ts -- pnpm install --frozen-lockfile --ignore-scripts

      - name: 🔒 Run dependency advisory scan
        run: |
          node scripts/warning-gate.ts -- pnpm run advisory:scan -- --scanner .cache/osv-scanner/osv-scanner --output .advisory/osv-results.json

  coverage:
    name: ${{ github.event_name == 'workflow_dispatch' && 'report-only-coverage' || 'coverage' }}
    needs: queue-tested
    if: ${{ !cancelled() && needs.queue-tested.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ env.CI_SOURCE_SHA }}
          persist-credentials: false

      - name: 📦 Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: 🔐 Validate CI invocation
        run: node scripts/warning-gate.ts -- node scripts/workflow-security.mjs validate-ci-invocation

      - name: 🐍 Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: 📦 Activate pnpm
        run: |
          node scripts/warning-gate.ts -- corepack enable
          node scripts/warning-gate.ts -- corepack prepare pnpm@10.28.1 --activate

      - name: 📥 Install dependencies
        run: node scripts/warning-gate.ts -- pnpm install --frozen-lockfile

      - name: 🔧 Generate Prisma client
        run: node scripts/warning-gate.ts -- pnpm prisma:generate

      - name: 🔒 Verify blake3 override resolution
        run: |
          node scripts/warning-gate.ts -- pnpm why blake3-wasm
          node scripts/warning-gate.ts -- pnpm why @c4312/blake3-internal

      - name: 🗄️ Apply D1 migrations (local)
        run: pnpm run verify:clean:migrations

      - name: 🗄️ Rehearse D1 migrations with QA bindings
        run: pnpm run verify:clean:migrations:qa

      - name: 🗄️ Apply Prisma schema to test database
        run: DATABASE_URL="file:./test.db" node scripts/warning-gate.ts -- pnpm exec prisma db push --skip-generate

      - name: 🔎 CI preflight - seed backend + migration status
        run: |
          node scripts/warning-gate.ts -- pnpm exec wrangler d1 migrations list DB --local
          node scripts/warning-gate.ts -- pnpm exec wrangler d1 execute DB --local --command "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name;"

      - name: 🌱 Seed local D1 database
        run: node scripts/warning-gate.ts -- pnpm db:seed

      - name: 🔍 Typecheck
        run: pnpm run verify:clean:typecheck

      - name: 🔐 Verify generated API contract
        run: pnpm run verify:clean:generated-contract

      - name: 🧪 Test & Coverage
        run: pnpm run verify:clean:test:coverage

      - name: 🐍 Official Python MCP SDK conformance
        run: pnpm run verify:clean:test:mcp-sdk-python

      - name: 🏗️ Build
        run: pnpm run verify:clean:build

      - name: 🧹 Cleanup local disposable data
        if: always()
        run: node scripts/warning-gate.ts -- pnpm run cleanup:local:apply

  workers-coverage:
    name: ${{ github.event_name == 'workflow_dispatch' && 'report-only-workers-coverage' || 'workers-coverage' }}
    needs: queue-tested
    if: ${{ !cancelled() && needs.queue-tested.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ env.CI_SOURCE_SHA }}
          persist-credentials: false

      - name: 📦 Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: 🔐 Validate CI invocation
        run: node scripts/warning-gate.ts -- node scripts/workflow-security.mjs validate-ci-invocation

      - name: 📦 Activate pnpm
        run: |
          node scripts/warning-gate.ts -- corepack enable
          node scripts/warning-gate.ts -- corepack prepare pnpm@10.28.1 --activate

      - name: 📥 Install dependencies
        run: node scripts/warning-gate.ts -- pnpm install --frozen-lockfile

      - name: 🧪 Workers test coverage
        run: pnpm run verify:clean:test:workers:coverage

  e2e:
    name: ${{ github.event_name == 'workflow_dispatch' && 'report-only-e2e' || 'e2e' }}
    needs: queue-tested
    if: ${{ !cancelled() && needs.queue-tested.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_ENV: development
      SESSION_SECRET: ci-e2e-session-secret

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ env.CI_SOURCE_SHA }}
          persist-credentials: false

      - name: 📦 Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: 🔐 Validate CI invocation
        run: node scripts/warning-gate.ts -- node scripts/workflow-security.mjs validate-ci-invocation

      - name: 📦 Activate pnpm
        run: |
          node scripts/warning-gate.ts -- corepack enable
          node scripts/warning-gate.ts -- corepack prepare pnpm@10.28.1 --activate

      - name: 📥 Install dependencies
        run: node scripts/warning-gate.ts -- pnpm install --frozen-lockfile

      - name: 🔧 Generate Prisma client
        run: node scripts/warning-gate.ts -- pnpm prisma:generate

      - name: 🔒 Verify blake3 override resolution
        run: |
          node scripts/warning-gate.ts -- pnpm why blake3-wasm
          node scripts/warning-gate.ts -- pnpm why @c4312/blake3-internal

      - name: 🎭 Install Playwright Browsers
        run: |
          node scripts/warning-gate.ts -- pnpm exec playwright install-deps --dry-run chromium
          node scripts/warning-gate.ts -- sudo apt-get update
          node scripts/warning-gate.ts -- sudo sh -c 'printf "%s\n" "man-db man-db/auto-update boolean true" | debconf-set-selections'
          node scripts/warning-gate.ts -- sudo touch /var/lib/man-db/auto-update
          node scripts/warning-gate.ts -- sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_SUSPEND=1 apt-get -o Dpkg::Use-Pty=0 install -y --no-install-recommends xvfb fonts-noto-color-emoji fonts-unifont libfontconfig1 libfreetype6 xfonts-cyrillic xfonts-scalable fonts-liberation fonts-ipafont-gothic fonts-wqy-zenhei fonts-tlwg-loma-otf fonts-freefont-ttf libasound2t64 libatk-bridge2.0-0t64 libatk1.0-0t64 libatspi2.0-0t64 libcairo2 libcups2t64 libdbus-1-3 libdrm2 libgbm1 libglib2.0-0t64 libnspr4 libnss3 libpango-1.0-0 libx11-6 libxcb1 libxcomposite1 libxdamage1 libxext6 libxfixes3 libxkbcommon0 libxrandr2
          node scripts/warning-gate.ts -- pnpm exec playwright install chromium

      - name: 🗄️ Apply D1 migrations
        run: pnpm run verify:clean:migrations

      - name: 🌱 Seed local D1 database
        run: node scripts/warning-gate.ts -- pnpm db:seed

      - name: 🔐 Configure local Worker secrets
        run: |
          printf 'SESSION_SECRET=%s\nNODE_ENV=development\n' "$SESSION_SECRET" > .dev.vars

      - name: 🎭 Run Playwright tests
        run: pnpm run verify:clean:test:e2e

      - name: 🧹 Cleanup local disposable data
        if: always()
        run: node scripts/warning-gate.ts -- pnpm run cleanup:local:apply

      - name: 📤 Upload Playwright Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      # Full-page captures from e2e/screens.spec.ts, for reviewing a visual change from this build.
      - name: 📸 Upload screens
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: screens
          path: screens/
          retention-days: 30
