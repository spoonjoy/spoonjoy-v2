name: MCP X-ray

# Ouro UI's AX X-ray against Spoonjoy's stdio MCP server (scripts/mcp-xray.ts), on main, with its JSON report uploaded as
# the `mcp-xray` artifact (report.json). Ouro UI's adoption ledger reads that report for Spoonjoy web's "AX must claims
# pass in CI" condition (https://ui.ouroboros.bot/adoption/). CI's unit-changed job runs the same X-ray on each pull
# request as a gate; this workflow only publishes main's report. It runs on the local SQLite test database as a
# synthetic chef, never against Spoonjoy itself, and the weekly run keeps a report from expiring.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/mcp-xray.yml
      - scripts/mcp-xray.ts
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-xray-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mcp-xray:
    name: mcp-xray
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: 📦 Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: 📦 Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.1 --activate

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔧 Generate Prisma client
        run: pnpm prisma:generate

      - name: 🗄️ Apply Prisma schema to test database
        run: DATABASE_URL="file:./test.db" pnpm exec prisma db push --skip-generate

      # The X-ray's JSON report goes to report.json; the step fails unless every must claim holds and every declared
      # tool is served, as in CI.
      - name: 🩻 MCP X-ray
        run: |
          set -o pipefail
          DATABASE_URL="file:./test.db" pnpm -s exec tsx scripts/mcp-xray.ts --json > report.json
          node -e 'const r = JSON.parse(require("fs").readFileSync("report.json", "utf8")); console.log(`${r.tool} ${r.checker.version}: ${r.summary.mustHolding} of ${r.summary.must} must claims hold, ${r.summary.holding} of ${r.summary.claims} claims; conformant: ${r.conformant}`)'

      - name: 📤 Upload the report
        if: ${{ !cancelled() && hashFiles('report.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mcp-xray
          path: report.json
          retention-days: 90
