name: Ouro Toaster exact-source conformance
on:
  push:
    branches: [probe/ouro-popover-alignment-20261015]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - run: |
          corepack enable
          corepack prepare pnpm@10.28.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: Verify exact upstream candidate and unchanged consumer toolchain
        run: |
          git rev-parse HEAD
          node --input-type=module -e '
            import fs from "node:fs";
            import crypto from "node:crypto";
            const m = JSON.parse(fs.readFileSync(".github/toaster-proof-source.json", "utf8"));
            console.log(JSON.stringify(m, null, 2));
            for (const f of m.files) {
              const hash = crypto.createHash("sha256").update(fs.readFileSync(f.proofPath)).digest("hex");
              if (hash !== f.proofSha256) throw new Error(`Source mismatch: ${f.proofPath}`);
            }'
          sha256sum vitest.ouro.config.ts package.json pnpm-lock.yaml app/styles/tailwind.css
          node -e 'const fs=require("node:fs"); for (const n of ["vitest","@playwright/test","@base-ui/react","tailwindcss","tailwind-merge","typescript"]) console.log(n, JSON.parse(fs.readFileSync(`node_modules/${n}/package.json`, "utf8")).version)'
          git diff --exit-code 956e00db2e2a7778be605534ff9e45cce12cf343 -- vitest.ouro.config.ts package.json pnpm-lock.yaml app/styles/tailwind.css
          git diff 956e00db2e2a7778be605534ff9e45cce12cf343 -- app/components/ouro/toast
      - name: Whole Toaster browser and touch suites with full source coverage
        run: |
          node scripts/run-with-warning-policy.mjs -- pnpm exec vitest run \
            --config vitest.ouro.config.ts app/components/ouro/toast \
            --coverage \
            --coverage.include=app/components/ouro/toast/toaster.tsx \
            --coverage.include=app/components/ouro/toast/toaster-styles.ts \
            --coverage.include=app/lib/ouro/toast.ts \
            --reporter=default --reporter=json --outputFile.json=toaster-conformance.json
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: toaster-exact-source-conformance
          path: |
            .github/toaster-proof-source.json
            toaster-conformance.json
            coverage/
          if-no-files-found: error
