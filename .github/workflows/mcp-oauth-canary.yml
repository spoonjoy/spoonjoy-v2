name: MCP OAuth Canary

# The hourly run is dispatched by the spoonjoy-uptime-monitor Worker's Cron
# Trigger (workers/uptime-monitor), because GitHub's scheduler dropped about 80%
# of this workflow's hourly `schedule:` runs. The schedule below is only a
# backstop in case that Worker stops dispatching.
on:
  workflow_dispatch:
  schedule:
    - cron: "53 */6 * * *"

concurrency:
  group: mcp-oauth-canary
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  canary:
    name: canary
    # Runs in Playwright's image, at the version package.json pins, by digest
    # (test/workflows/playwright-image.test.ts): its browsers and their system packages are in it, so
    # the job installs nothing from Ubuntu's mirror, whose downloads can stall for the whole job. The
    # runner's own zstd is lent to the image so actions/cache uses the same compression as the runner,
    # which needs the image's Ubuntu (24.04), so the job names that runner. setup-node's package cache
    # is off: its path differs inside the container.
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f # v1.64.0-noble
      options: --user 1001 -v /usr/bin/zstd:/usr/bin/zstd:ro
    timeout-minutes: 25

    steps:
      - name: Check GitHub Cloudflare credentials
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::error::MCP OAuth canary cannot run: CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not configured."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        if: steps.cloudflare.outputs.ready == 'true'

      - name: Setup Node.js
        if: steps.cloudflare.outputs.ready == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: ""

      - name: Activate pnpm
        if: steps.cloudflare.outputs.ready == 'true'
        run: |
          corepack enable
          corepack prepare pnpm@10.28.1 --activate

      - name: Install dependencies
        if: steps.cloudflare.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        if: steps.cloudflare.outputs.ready == 'true'
        run: pnpm prisma:generate

      - name: Run MCP OAuth canary
        id: mcp-canary
        if: steps.cloudflare.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SPOONJOY_MCP_CANARY_BASE_URL: https://spoonjoy.app
        run: pnpm run smoke:mcp:oauth -- --out mcp-oauth-canary-artifacts

      - name: Report MCP OAuth canary
        if: always() && steps.cloudflare.outputs.ready == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MCP_CANARY_STATUS: ${{ steps.mcp-canary.outcome }}
          MCP_CANARY_WORKFLOW_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/report-mcp-oauth-canary.mjs --artifact-dir mcp-oauth-canary-artifacts --status "$MCP_CANARY_STATUS" --workflow-run-url "$MCP_CANARY_WORKFLOW_RUN_URL" --manage-issue

      - name: Upload MCP OAuth canary artifacts
        if: always() && steps.cloudflare.outputs.ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mcp-oauth-canary-artifacts
          path: mcp-oauth-canary-artifacts/
          retention-days: 14
