name: Ouro Toaster prospective viewport proof
on:
  push:
    branches: [probe/ouro-popover-alignment-20261015]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: [ouro-chromium, ouro-webkit, ouro-touch]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - run: |
          corepack enable
          corepack prepare pnpm@10.28.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: Record unchanged old Toaster runtime, prospective tests and tool versions (RED)
        run: |
          git rev-parse HEAD
          echo 'Unchanged upstream Toaster: 08f32c208b16ae669c04eedbe30bae739411e6ce'
          sha256sum app/components/ouro/toast/* app/lib/ouro/toast.ts vitest.ouro.config.ts package.json pnpm-lock.yaml app/styles/tailwind.css
          node -e 'const fs=require("node:fs"); for (const n of ["vitest","@playwright/test","@base-ui/react","tailwindcss","tailwind-merge","typescript"]) console.log(n, JSON.parse(fs.readFileSync(`node_modules/${n}/package.json`, "utf8")).version)'
          git diff --exit-code 956e00db2e2a7778be605534ff9e45cce12cf343 -- app/components/ouro/toast/toaster.tsx app/components/ouro/toast/toaster-styles.ts vitest.ouro.config.ts package.json pnpm-lock.yaml app/styles/tailwind.css
          git diff 956e00db2e2a7778be605534ff9e45cce12cf343 -- app/components/ouro/toast
      - name: Prospective layout RED against unchanged runtime
        run: |
          node scripts/run-with-warning-policy.mjs -- pnpm exec vitest run \
            --config vitest.ouro.config.ts --project '${{ matrix.project }}' \
            app/components/ouro/toast/toaster.test.tsx \
            --testNamePattern 'unprefixed app clearance' \
            --reporter=default --reporter=json --outputFile.json=toaster-layout-red.json
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: toaster-layout-red-${{ matrix.project }}
          path: |
            toaster-layout-red.json
          if-no-files-found: error
