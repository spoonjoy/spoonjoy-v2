name: Sim Callback Throwaway

# Seeds or removes one throwaway account on production for spoonjoy-apple's browser sign-in callback proof
# (.github/workflows/browser-signin-callback.yml there). scripts/sim-callback-throwaway.mjs accepts only the
# proof's own account shape (probecb<18 hex>, simcallbackprobe<tag>, sim-callback-probe-<date>-<tag>@example.com),
# so it can never touch a real account. The caller makes the password and passes only its bcrypt hash.
#
# cleanup counts the account's tokens, deletes its rows and its chef search document, asks spoonjoy.app's search
# to drain, and fails unless a scan of every text column of every table finds neither the id nor the tag.
on:
  workflow_dispatch:
    inputs:
      action:
        description: seed or cleanup
        type: choice
        options: [seed, cleanup]
      account_id:
        description: probecb<18 hex>
        type: string
        required: true
      email:
        description: sim-callback-probe-<YYYYMMDD>-<tag>@example.com
        type: string
        required: true
      username:
        description: simcallbackprobe<tag>
        type: string
        required: true
      password_hash:
        description: bcrypt cost-10 hash (seed only)
        type: string
        default: ""
      password_salt:
        description: the bcrypt salt of that hash (seed only)
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: sim-callback-throwaway-${{ inputs.account_id }}
  cancel-in-progress: false

jobs:
  throwaway:
    if: github.repository == 'spoonjoy/spoonjoy-v2' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ACCOUNT_ID: ${{ inputs.account_id }}
      ACCOUNT_EMAIL: ${{ inputs.email }}
      ACCOUNT_USERNAME: ${{ inputs.username }}
      PASSWORD_HASH: ${{ inputs.password_hash }}
      PASSWORD_SALT: ${{ inputs.password_salt }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Seed the throwaway
        if: inputs.action == 'seed'
        run: node scripts/sim-callback-throwaway.mjs seed

      - name: Delete the throwaway's rows
        if: inputs.action == 'cleanup'
        run: node scripts/sim-callback-throwaway.mjs cleanup

      - name: Scan every table until nothing mentions the throwaway
        if: inputs.action == 'cleanup'
        run: |
          # Deleting the user queues a search update; a search request drains the queue.
          for attempt in 1 2 3 4; do
            curl -fsS -o /dev/null "https://spoonjoy.app/search?q=simcallbackprobe" || true
            sleep 20
            if node scripts/sim-callback-throwaway.mjs scan; then
              exit 0
            fi
            echo "Attempt $attempt: rows still match; draining search and scanning again."
          done
          exit 1
