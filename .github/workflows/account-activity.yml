name: Account Activity

# Read-only answer to "has this person got back in?": one account's last sign-in (time and method) and when
# it was last seen, or the 20 most recent sign-ins, from production D1 (scripts/account-activity.ts). It
# prints no email address and writes nothing.

on:
  workflow_dispatch:
    inputs:
      account:
        description: A username or user id, or --recent for the 20 most recent sign-ins
        required: true
        type: string

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  guard:
    name: require trusted main
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Reject non-main workflow code
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Production D1 credentials are restricted to refs/heads/main."
            exit 1
          fi

  lookup:
    name: lookup
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Look up account activity
        env:
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCOUNT: ${{ inputs.account }}
        run: pnpm exec tsx scripts/account-activity.ts "$ACCOUNT"
