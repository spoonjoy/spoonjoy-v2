name: UI teardown boundary diagnostic
on:
  push:
    branches: [probe/ui-teardown-boundaries-20261017]
permissions:
  contents: read
jobs:
  boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PRISMA_HIDE_UPDATE_MESSAGE: "1"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"
      - run: corepack enable && corepack prepare pnpm@10.28.1 --activate
      - name: Restore only after actual missing CI tool
        run: |
          if [ ! -x node_modules/.bin/vitest ]; then
            printf '%s\n' 'Fresh CI checkout has no Vitest executable; restoring authoritative frozen dependencies.'
            pnpm install --frozen-lockfile
          fi
      - run: DATABASE_URL=file:./test.db pnpm exec prisma db push --skip-generate
      # Vitest's unchanged collector enforces console diagnostics. The outer text
      # gate is not used for this private phase/caller JSON observation.
      - name: Preserve full native coverage workload while recording cookbook teardown phases
        run: |
          set +e
          pnpm run api:playground:generate
          pnpm exec vitest run --coverage > "$RUNNER_TEMP/ui-teardown.log" 2>&1
          result=$?
          cat "$RUNNER_TEMP/ui-teardown.log"
          printf '%s\n' "$result" > "$RUNNER_TEMP/ui-teardown-exit.txt"
          grep -q 'UI_TEARDOWN_START {' "$RUNNER_TEMP/ui-teardown.log" || exit 3
          exit "$result"
      - name: Require non-vacuous pending-entrance cancellation
        if: always()
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from "node:fs";
          import assert from "node:assert/strict";
          const log = readFileSync(`${process.env.RUNNER_TEMP}/ui-teardown.log`, "utf8").replace(/\x1b\[[0-9;]*m/g, "");
          const records = (marker) => [...log.matchAll(new RegExp(`${marker} (\\{"[^\\n]*)`, "g"))].map((match) => JSON.parse(match[1]));
          const before = records("UI_TEARDOWN_START");
          const after = records("UI_TEARDOWN_UNMOUNTED");
          const pending = before.filter((record) => record.starting.length > 0);
          assert.equal(before.length, 123);
          assert.equal(after.length, before.length);
          assert.ok(pending.length > 0, "No pending entrance observed; cancellation control is inconclusive");
          assert.ok(after.every((record) => record.mounted === 0 && record.starting.length === 0));
          assert.deepEqual(after.map((record) => record.test), before.map((record) => record.test));
          assert.equal(records("UI_TEARDOWN_DIAGNOSTIC").length, 0);
          assert.ok(!log.includes("not wrapped in act"));
          assert.match(log, /Tests\s+2 failed \| 11433 passed \(11435\)/);
          console.log("UI_TEARDOWN_CANCELLATION_PROOF", JSON.stringify({ tests: before.length, pending: pending.length, unmountedBeforeResourceCleanup: after.length, diagnostics: 0, expectedPrivateProbePolicyFailures: 2 }));
          JS
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ui-teardown-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ui-teardown.log
            ${{ runner.temp }}/ui-teardown-exit.txt
          if-no-files-found: error
