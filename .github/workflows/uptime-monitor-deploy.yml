name: Uptime Monitor Deploy

# Deploys the spoonjoy-uptime-monitor Worker (workers/uptime-monitor), which
# probes production every minute from a Cloudflare Cron Trigger and dispatches
# the MCP OAuth canary hourly. Its GITHUB_TOKEN secret is set once with
# `wrangler secret put GITHUB_TOKEN -c workers/uptime-monitor/wrangler.json`
# and is not managed here.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "workers/uptime-monitor/**"
      - ".github/workflows/uptime-monitor-deploy.yml"

concurrency:
  group: uptime-monitor-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Check GitHub Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::Uptime monitor cannot deploy: CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not configured."
            exit 1
          fi

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy uptime monitor Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy -c workers/uptime-monitor/wrangler.json

      - name: Confirm the Worker answers
        run: |
          curl -fsS --retry 5 --retry-delay 3 --retry-all-errors https://spoonjoy-uptime-monitor.mendelow-studio.workers.dev/ | grep -q "spoonjoy uptime monitor"
