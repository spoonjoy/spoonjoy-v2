name: QA Run Sweep

# Deletes per-run QA stacks (spoonjoy-v2-qa-run-* Workers and spoonjoy-qa-run-* D1 databases)
# older than three hours, which a Journeys run left behind because it was cancelled or its runner
# died before its teardown. Every Journeys run's prepare also sweeps; this catches stacks when no
# run starts for a while. It fails when more than 100 run Workers are in use, long before the
# account's 500-script limit, so a broken teardown is seen. Never touches shared QA: only names
# matching the per-run patterns are candidates (scripts/qa-run-scope.mjs).
on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-run-sweep
  cancel-in-progress: false

jobs:
  sweep:
    if: github.repository == 'spoonjoy/spoonjoy-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: Delete stale QA run stacks
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/qa-run-scope.mjs sweep
