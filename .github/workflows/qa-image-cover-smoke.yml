name: QA Image Cover Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 10 * * *"

concurrency:
  group: qa-image-cover-smoke
  cancel-in-progress: false

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  smoke:
    name: smoke
    # Runs in Playwright's image, at the version package.json pins, by digest
    # (test/workflows/playwright-image.test.ts): its browsers and their system packages are in it, so
    # the job installs nothing from Ubuntu's mirror, whose downloads can stall for the whole job. The
    # runner's own zstd is lent to the image so actions/cache uses the same compression as the runner,
    # which needs the image's Ubuntu (24.04), so the job names that runner. setup-node's package cache
    # is off: its path differs inside the container.
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f # v1.64.0-noble
      options: --user 1001 -v /usr/bin/zstd:/usr/bin/zstd:ro
    timeout-minutes: 45

    steps:
      - name: Check GitHub Cloudflare credentials
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Skipping QA image-cover smoke because Cloudflare GitHub secrets are not configured."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        if: steps.cloudflare.outputs.ready == 'true'

      - name: Setup Node.js
        if: steps.cloudflare.outputs.ready == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: ""

      - name: Activate pnpm
        if: steps.cloudflare.outputs.ready == 'true'
        run: |
          corepack enable
          corepack prepare pnpm@10.28.1 --activate

      - name: Install dependencies
        if: steps.cloudflare.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        if: steps.cloudflare.outputs.ready == 'true'
        run: pnpm prisma:generate

      - name: Check QA image-provider secrets
        id: qa-secrets
        if: steps.cloudflare.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          secrets_json="$(pnpm exec wrangler secret list --env qa)"
          echo "$secrets_json"

          if ! printf '%s' "$secrets_json" | grep -Eq '"(OPENAI_API_KEY|GEMINI_API_KEY|GOOGLE_API_KEY)"'; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Skipping QA image-cover smoke because no QA image-provider secret is configured."
            exit 1
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Run QA image-cover smoke
        if: steps.cloudflare.outputs.ready == 'true' && steps.qa-secrets.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SPOONJOY_QA_SMOKE_BASE_URL: https://spoonjoy-v2-qa.mendelow-studio.workers.dev
          SPOONJOY_QA_SMOKE_TARGET: --target-env qa
        run: pnpm run smoke:qa:image-cover

      - name: Upload QA image-cover smoke artifacts
        if: always() && steps.cloudflare.outputs.ready == 'true' && steps.qa-secrets.outputs.ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: qa-image-cover-smoke-artifacts
          path: qa-image-cover-smoke-artifacts/
          retention-days: 14
