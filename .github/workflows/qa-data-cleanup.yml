name: QA Data Cleanup

# Removes disposable accounts on shared QA (scripts/cleanup-local-qa-data.mjs's codex-* and
# e2e-passkey-* rules) that are older than a cutoff, with their recipes, covers and photos, then
# fails if any disposable account older than the cutoff is left. Accounts newer than the cutoff
# stay, so a run still using one is never cut short: the longest runs that make these accounts on
# shared QA (native Apple journeys, the image-cover smoke, the MCP OAuth canary) finish well
# within the 6-hour default, and Journeys runs use their own databases.
#
# Every step counts the cutoff back from the same moment, the job's start (CLEANUP_AS_OF), so the
# preview, the removal and the final check all choose the same accounts.
#
# Daily at 07:23 UTC, when no scheduled QA job runs, and by hand from main with the same cutoff.
# It shares the image-cover smoke's concurrency group, so the two never overlap; GitHub keeps one
# pending run per group, so starting one while the other runs and a third waits cancels the waiting one.
on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:
    inputs:
      older_than_hours:
        description: Delete only disposable accounts created more than this many hours ago
        type: string
        default: "6"

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  # A scheduled run has no inputs, so it takes the same default as a manual one.
  OLDER_THAN_HOURS: ${{ inputs.older_than_hours || '6' }}

concurrency:
  group: qa-image-cover-smoke
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.repository == 'spoonjoy/spoonjoy-v2' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Check the cutoff
        run: |
          if ! [[ "$OLDER_THAN_HOURS" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::older_than_hours must be a whole number of hours, at least 1 (got '$OLDER_THAN_HOURS')."
            exit 1
          fi
          echo "CLEANUP_AS_OF=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Show what the cleanup will remove
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/cleanup-local-qa-data.mjs --target-env qa --older-than-hours "$OLDER_THAN_HOURS" --as-of "$CLEANUP_AS_OF"

      - name: Remove disposable QA data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/cleanup-local-qa-data.mjs --target-env qa --apply --older-than-hours "$OLDER_THAN_HOURS" --as-of "$CLEANUP_AS_OF"

      # The dry run's JSON follows wrangler's log lines, so jq reads from the first line that opens it.
      - name: Confirm no disposable account older than the cutoff is left
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          counts="$(node scripts/cleanup-local-qa-data.mjs --target-env qa --older-than-hours "$OLDER_THAN_HOURS" --as-of "$CLEANUP_AS_OF" | awk 'found || /^\[/ { found = 1; print }')"
          remaining="$(jq -r '[.[].results[] | select(.item == "disposable users")][0].count' <<<"$counts")"
          kept="$(jq -r '[.[].results[] | select(.item == "disposable users kept because they are newer than the cutoff")][0].count' <<<"$counts")"
          echo "Disposable accounts older than $OLDER_THAN_HOURS hours left: $remaining"
          echo "Disposable accounts newer than the cutoff, kept: $kept"
          test "$remaining" = "0"
