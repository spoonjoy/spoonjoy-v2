name: MCP OAuth D1 Audit

on:
  workflow_dispatch:
    inputs:
      apply_oauth_grant_backfill:
        description: Apply the exact reviewed OAuth grant backfill plan
        required: false
        default: false
        type: boolean
      oauth_grant_plan_sha256:
        description: Required exact dry-run digest when apply is enabled
        required: false
        type: string
  schedule:
    - cron: "41 * * * *"

concurrency:
  group: mcp-oauth-d1-audit
  cancel-in-progress: false

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  guard:
    name: require trusted main
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Reject non-main workflow code
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Production D1 credentials are restricted to refs/heads/main."
            exit 1
          fi

  audit:
    name: readonly audit
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
      actions: read

    steps:
      - name: Require GitHub Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "Cloudflare GitHub secrets are required for the MCP OAuth D1 audit."
            exit 1
          fi

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A concurrent Production Deploy or MCP OAuth Canary run can leave transient rows (e.g.
      # canary_user_residue) that make this read-only audit report false positives (seen
      # 2026-09-26, run 36275447499; a re-run passed). Wait out any in-flight run of either
      # workflow immediately before the first step that reads production data, so the checkout
      # and dependency install above cannot widen the race window between the check and the
      # read. This avoids editing production-deploy.yml, whose deploy job step inventory and
      # shell bodies are frozen by test/release-workflow-security.test.ts.
      - name: Wait for in-flight production deploy or canary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          max_attempts=40
          interval_seconds=30
          attempt=0
          busy_workflows="production-deploy.yml mcp-oauth-canary.yml"
          busy_status_pattern='^(in_progress|queued|waiting|pending|requested)$'

          fetch_statuses() {
            local workflow="$1"
            local gh_attempt=0
            local gh_max_attempts=3
            local output=""
            while :; do
              gh_attempt=$((gh_attempt + 1))
              if output="$(gh run list --workflow "$workflow" --json status --repo "$GITHUB_REPOSITORY" --jq '.[].status' 2>&1)"; then
                printf '%s\n' "$output"
                return 0
              fi
              if [ "$gh_attempt" -ge "$gh_max_attempts" ]; then
                echo "::error::gh run list --workflow $workflow failed $gh_max_attempts times: $output" >&2
                return 1
              fi
              echo "gh run list --workflow $workflow failed (attempt $gh_attempt/$gh_max_attempts); retrying in 5s..." >&2
              sleep 5
            done
          }

          while :; do
            statuses=""
            for workflow in $busy_workflows; do
              statuses="$statuses
          $(fetch_statuses "$workflow")"
            done
            statuses="$(printf '%s\n' "$statuses" | sed '/^$/d' | sort -u | tr '\n' ' ')"
            if ! printf '%s\n' "$statuses" | tr ' ' '\n' | grep -Eq "$busy_status_pattern"; then
              echo "No in-flight Production Deploy or MCP OAuth Canary run. Proceeding with the read-only audit."
              break
            fi
            attempt=$((attempt + 1))
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::Timed out after 20 minutes waiting for in-flight Production Deploy / MCP OAuth Canary runs to finish. Refusing to audit mid-deploy."
              exit 1
            fi
            echo "A Production Deploy or MCP OAuth Canary run is busy (statuses: $statuses). Waiting 30s before re-checking (attempt $attempt/$max_attempts)..."
            sleep "$interval_seconds"
          done

      - name: Dry-run OAuth grant backfill
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/backfill-oauth-grants.mjs --target-env production --base-url https://spoonjoy.app --out oauth-grant-backfill-report.json

      - name: Run MCP OAuth D1 audit
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MCP_OAUTH_AUDIT_WORKFLOW_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: pnpm run audit:mcp:oauth -- --out mcp-oauth-d1-audit-artifacts

      - name: Upload MCP OAuth D1 audit artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mcp-oauth-d1-audit-artifacts
          path: mcp-oauth-d1-audit-artifacts/
          retention-days: 14

      - name: Upload OAuth grant backfill artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: oauth-grant-backfill-report
          path: oauth-grant-backfill-report.json
          retention-days: 14

  apply:
    name: protected exact-plan apply
    needs: [guard, audit]
    if: github.event_name == 'workflow_dispatch' && inputs.apply_oauth_grant_backfill
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Require reviewed plan digest and Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OAUTH_GRANT_PLAN_SHA256: ${{ inputs.oauth_grant_plan_sha256 }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "Cloudflare GitHub secrets are required for the OAuth grant backfill."
            exit 1
          fi
          if ! printf '%s' "$OAUTH_GRANT_PLAN_SHA256" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "A reviewed 64-character lowercase plan digest is required."
            exit 1
          fi

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply exact reviewed OAuth grant backfill plan
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OAUTH_GRANT_PLAN_SHA256: ${{ inputs.oauth_grant_plan_sha256 }}
        run: |
          node scripts/backfill-oauth-grants.mjs \
            --target-env production \
            --base-url https://spoonjoy.app \
            --out oauth-grant-backfill-apply-report.json \
            --apply \
            --expect-plan-sha256 "$OAUTH_GRANT_PLAN_SHA256" \
            --confirm-production-apply

      - name: Verify post-apply D1 invariants
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MCP_OAUTH_AUDIT_WORKFLOW_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: pnpm run audit:mcp:oauth -- --out mcp-oauth-d1-post-apply-artifacts

      - name: Upload protected apply evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: oauth-grant-backfill-apply-evidence
          path: |
            oauth-grant-backfill-apply-report.json
            mcp-oauth-d1-post-apply-artifacts/
          retention-days: 14
