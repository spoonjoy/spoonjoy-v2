name: Storybook

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

concurrency:
  group: storybook-${{ github.ref }}
  cancel-in-progress: true

env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  build-storybook:
    name: ${{ github.event_name == 'workflow_dispatch' && 'manual-build-storybook' || 'build-storybook' }}
    # Runs in Playwright's image, at the version package.json pins, by digest
    # (test/workflows/playwright-image.test.ts): its browsers and their system packages are in it, so
    # the job installs nothing from Ubuntu's mirror, whose downloads can stall for the whole job. The
    # runner's own zstd is lent to the image so actions/cache uses the same compression as the runner,
    # which needs the image's Ubuntu (24.04), so the job names that runner. setup-node's package cache
    # is off: its path differs inside the container.
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f # v1.64.0-noble
      options: --user 1001 -v /usr/bin/zstd:/usr/bin/zstd:ro
    permissions:
      contents: read
      deployments: write
    
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: 📦 Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: ""

      - name: 📦 Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.1 --activate
      
      # Without install scripts: the only one allowed (pnpm-workspace.yaml) builds better-sqlite3
      # from source, which needs make and a C++ compiler the image lacks, and only the unit tests
      # use it. The root postinstall is "prisma generate", which the next step runs.
      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      
      - name: 🔧 Generate Prisma client
        run: pnpm prisma:generate
      
      - name: 📚 Build Storybook
        run: pnpm build-storybook

      # Ouro UI (app/components/ouro, installed from its shadcn registry) ships its own tests. They
      # run here, beside the Storybook they use, on every pull request, merge-queue run and push to
      # main: the Vitest browser tests in Chromium, WebKit and a touch phone with 100% coverage of
      # the Ouro UI files (vitest.ouro.config.ts), then the Playwright specs in e2e/ouro against
      # the Storybook just built (playwright.ouro.config.ts). Both run under the warning policy.
      - name: 🧪 Ouro UI browser tests and coverage
        run: pnpm run verify:clean:test:ouro

      - name: 🎭 Ouro UI specs against the built Storybook
        run: |
          python3 -m http.server 6006 --bind 127.0.0.1 --directory storybook-static > "$RUNNER_TEMP/storybook-server.log" 2>&1 &
          for _ in $(seq 50); do curl -sf http://127.0.0.1:6006/iframe.html > /dev/null && break; sleep 0.2; done
          OURO_E2E_URL=http://127.0.0.1:6006 pnpm run verify:clean:test:e2e:ouro

      - name: Prepare Cloudflare Pages deploy directory
        if: github.ref == 'refs/heads/main'
        run: |
          rm -rf storybook-pages-deploy
          mkdir -p storybook-pages-deploy
          mv storybook-static storybook-pages-deploy/storybook-static
          printf '%s\n' '{' '  "name": "spoonjoy-storybook",' '  "pages_build_output_dir": "storybook-static"' '}' > storybook-pages-deploy/wrangler.json

      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: storybook-pages-deploy
          packageManager: npm
          command: pages deploy --project-name=spoonjoy-storybook --branch=${{ github.ref_name }} --commit-hash=${{ github.sha }} --commit-dirty=true
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
