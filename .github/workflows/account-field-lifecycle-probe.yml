name: Account field lifecycle diagnostic
on:
  push:
    branches: [probe/account-field-lifecycle-20261017]
permissions:
  contents: read
jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PRISMA_HIDE_UPDATE_MESSAGE: "1"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"
      - run: corepack enable && corepack prepare pnpm@10.28.1 --activate
      - name: Restore only after actual missing CI tool
        run: |
          if [ ! -x node_modules/.bin/vitest ]; then
            printf '%s\n' 'Fresh CI checkout has no Vitest executable; restoring authoritative frozen dependencies.'
            pnpm install --frozen-lockfile
          fi
      - run: DATABASE_URL=file:./test.db pnpm exec prisma db push --skip-generate
      # Keep the unchanged Vitest warning collector; the outer text gate would reject
      # diagnostic JSON that quotes an existing test name containing "warning".
      - name: Run original affected-test selection with passive lifecycle instrumentation
        run: |
          set +e
          pnpm run api:playground:generate
          SPOONJOY_CHANGED_SINCE=ca829f3cbfeb4efa49c84828c4f2d271a24bcd78 node scripts/test-changed.mjs > "$RUNNER_TEMP/field-lifecycle.log" 2>&1
          result=$?
          cat "$RUNNER_TEMP/field-lifecycle.log"
          printf '%s\n' "$result" > "$RUNNER_TEMP/field-lifecycle-exit.txt"
          grep -q '281 test file(s) are affected' "$RUNNER_TEMP/field-lifecycle.log" || exit 2
          grep -q 'FIELD_ASSERTION_COMPLETE' "$RUNNER_TEMP/field-lifecycle.log" || exit 3
          exit "$result"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: field-lifecycle-passive-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/field-lifecycle.log
            ${{ runner.temp }}/field-lifecycle-exit.txt
          if-no-files-found: error
